name: OpenClaw Cross-OS Release Checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Public OpenClaw ref to validate (tag, branch, or full commit SHA)
        required: true
        type: string
      provider:
        description: Provider lane to use for onboarding and the end-to-end turn
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
          - minimax
      mode:
        description: Which release-check lanes to run
        required: true
        default: both
        type: choice
        options:
          - both
          - fresh
          - upgrade
      previous_version:
        description: Optional baseline version for the upgrade lane (defaults to npm latest)
        required: false
        default: ""
        type: string
      ubuntu_runner:
        description: Optional Linux runner label override
        required: false
        default: ""
        type: string
      windows_runner:
        description: Optional Windows runner label override
        required: false
        default: ""
        type: string
      macos_runner:
        description: Optional macOS runner label override
        required: false
        default: ""
        type: string

concurrency:
  group: openclaw-cross-os-release-checks-${{ inputs.ref }}-${{ inputs.provider }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  cross_os_release_checks:
    permissions:
      contents: read
    uses: openclaw/openclaw/.github/workflows/openclaw-cross-os-release-checks-reusable.yml@main
    with:
      ref: ${{ inputs.ref }}
      provider: ${{ inputs.provider }}
      mode: ${{ inputs.mode }}
      previous_version: ${{ inputs.previous_version }}
      ubuntu_runner: ${{ inputs.ubuntu_runner }}
      windows_runner: ${{ inputs.windows_runner }}
      macos_runner: ${{ inputs.macos_runner }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
