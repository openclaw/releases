name: OpenClaw macOS Validate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OpenClaw release tag to validate on macOS (for example v2026.3.22 or v2026.3.22-beta.1)
        required: true
        type: string
      source_ref:
        description: Optional public openclaw/openclaw source ref to validate instead of the tag, for release-branch-only packaging fixes after npm/tag publication
        required: false
        type: string

concurrency:
  group: openclaw-macos-validate-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_REPOSITORY: openclaw/openclaw

jobs:
  macos_validate:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Ensure matching public GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$OPENCLAW_REPOSITORY" >/dev/null

      - name: Clone selected public source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone https://github.com/openclaw/openclaw.git source
          if [[ -z "${SOURCE_REF}" ]]; then
            git -C source checkout --detach "refs/tags/${RELEASE_TAG}"
            exit 0
          fi
          if [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            git -C source fetch origin "${SOURCE_REF}"
            git -C source checkout --detach "${SOURCE_REF}"
            exit 0
          fi
          if [[ "${SOURCE_REF}" != "main" && ! "${SOURCE_REF}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid source_ref: ${SOURCE_REF}" >&2
            exit 1
          fi
          git -C source fetch origin "+refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          git -C source checkout --detach "refs/remotes/origin/${SOURCE_REF}"

      - name: Checkout submodules (retry)
        working-directory: source
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule update failed (attempt $attempt/5). Retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Select Xcode 26.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-release-${{ hashFiles('source/apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-release-

      - name: Swift test
        working-directory: source
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          import subprocess
          import sys

          command = ["swift", "test", "--package-path", "apps/macos", "--no-parallel"]
          timeout_seconds = 900
          timed_out = False

          try:
              completed = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=timeout_seconds,
              )
              output = completed.stdout or ""
              returncode = completed.returncode
          except subprocess.TimeoutExpired as exc:
              timed_out = True
              output = exc.stdout or ""
              if isinstance(output, bytes):
                  output = output.decode(errors="replace")
              returncode = 124

          print(output, end="", flush=True)

          passed_tests = len(re.findall(r"✔ Test ", output))
          passed_suites = len(re.findall(r"✔ Suite ", output))
          failed_tests = len(re.findall(r"✘ Test ", output))
          failed_suites = len(re.findall(r"✘ Suite ", output))
          build_errors = [
              line for line in output.splitlines()
              if re.search(r":\d+:\d+: error:", line.lower())
              or line.strip().lower().startswith(("error:", "fatal error:"))
          ]

          if returncode == 0:
              sys.exit(0)

          if timed_out and failed_tests == 0 and failed_suites == 0 and not build_errors and passed_tests >= 80 and passed_suites >= 15:
              print(
                  f"::warning::swift test timed out after {timeout_seconds}s with "
                  f"{passed_tests} passed tests and {passed_suites} passed suites; "
                  "accepting known Swift Testing runner hang after no failures."
              )
              sys.exit(0)

          print(
              f"swift test failed: returncode={returncode} timed_out={timed_out} "
              f"passed_tests={passed_tests} passed_suites={passed_suites} "
              f"failed_tests={failed_tests} failed_suites={failed_suites} build_errors={len(build_errors)}",
              file=sys.stderr,
          )
          sys.exit(returncode or 124)
          PY

      - name: Capture validation provenance
        id: validation_provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git -C source rev-parse HEAD)"
          ARTIFACT_DIR="$RUNNER_TEMP/openclaw-macos-validate"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' "$RELEASE_TAG" > "$ARTIFACT_DIR/release-tag.txt"
          printf '%s\n' "$RELEASE_SHA" > "$ARTIFACT_DIR/release-sha.txt"
          echo "dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload validation proof artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-validate-${{ inputs.tag }}
          path: |
            ${{ steps.validation_provenance.outputs.dir }}/release-tag.txt
            ${{ steps.validation_provenance.outputs.dir }}/release-sha.txt
          if-no-files-found: error

      - name: Summarize validation
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## macOS validation"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Validation: \`swift test --package-path apps/macos --no-parallel\`"
            echo "- Validation proof artifact: \`macos-validate-${RELEASE_TAG}\`"
            echo
            echo "This lane is release-blocking validation, but it does not build, sign, notarize, package, or upload release artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
