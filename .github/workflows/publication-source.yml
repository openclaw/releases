name: Publication admission validator

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  inspect-publication-metadata:
    name: Inspect publication metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Admit current pull request metadata without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publication-source.mjs
