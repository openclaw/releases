name: OpenClaw NPM Dist-Tag Operations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dist-tag operation to run
        required: true
        default: sync_beta_to_stable
        type: choice
        options:
          - sync_beta_to_stable
          - promote_beta_to_latest
          - sync_stable_dist_tags
          - promote_extended_stable
      tag:
        description: Final OpenClaw release tag for manual promotion and manual dist-tag sync (for example v2026.4.14 or v2026.4.14-1)
        required: false
        type: string
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: openclaw-npm-dist-tags
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  OPENCLAW_REPOSITORY: openclaw/openclaw

jobs:
  sync_beta_to_stable:
    needs: [promote_beta_to_latest, sync_stable_dist_tags]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.mode == 'sync_beta_to_stable' || needs.promote_beta_to_latest.outputs.latest_published == 'true' || needs.sync_stable_dist_tags.outputs.latest_published == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main workflow ref for dist-tag sync
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Dist-tag sync runs must be dispatched from main."
            exit 1
          fi

      - name: Checkout trusted dist-tag tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/release-npm-beta-floor.mjs
          sparse-checkout-cone-mode: false

      - name: Read official plugin inventory
        uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: main
          path: source
          persist-credentials: false
          sparse-checkout: /extensions/*/package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate latest release tag exists in public repo
        run: |
          set -euo pipefail
          release_version="$(npm view openclaw dist-tags.latest --prefer-online)"
          if [[ ! "$release_version" =~ ^[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]; then
            echo "npm latest must identify a regular stable release." >&2
            exit 1
          fi
          git ls-remote --exit-code "https://github.com/${OPENCLAW_REPOSITORY}.git" \
            "refs/tags/v${release_version}" "refs/tags/v${release_version}^{}" >/dev/null

      - name: Enforce beta floor for core and published plugins
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Missing NPM_TOKEN secret." >&2
            exit 1
          fi
          npm_userconfig="$(mktemp)"
          trap 'rm -f "${npm_userconfig}"' EXIT
          chmod 0600 "${npm_userconfig}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${npm_userconfig}"
          export NPM_CONFIG_USERCONFIG="${npm_userconfig}"
          export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
          unset NODE_AUTH_TOKEN
          npm whoami >/dev/null
          {
            echo "## npm beta floor"
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          floor_rc=0
          node scripts/release-npm-beta-floor.mjs source 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || floor_rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$floor_rc"

  promote_beta_to_latest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'promote_beta_to_latest' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest_published: ${{ steps.publish_latest.outputs.latest_published }}
    steps:
      - name: Require main workflow ref for promotion
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Promotion runs must be dispatched from main."
            exit 1
          fi

      - name: Validate stable tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "Manual beta promotion requires a stable release tag." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]; then
            echo "Invalid stable release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate public stable tag exists
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code "https://github.com/${OPENCLAW_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" >/dev/null; then
            echo "Public release tag ${RELEASE_TAG} not found in ${OPENCLAW_REPOSITORY}." >&2
            exit 1
          fi

      - name: Validate npm dist-tags
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          beta_version="$(npm view openclaw dist-tags.beta)"
          latest_version="$(npm view openclaw dist-tags.latest)"

          echo "Current beta dist-tag: ${beta_version}"
          echo "Current latest dist-tag: ${latest_version}"

          if [[ "${beta_version}" != "${RELEASE_VERSION}" ]]; then
            echo "npm beta points at ${beta_version}, expected ${RELEASE_VERSION}." >&2
            exit 1
          fi

          if ! npm view "openclaw@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "openclaw@${RELEASE_VERSION} is not published on npm." >&2
            exit 1
          fi

      - name: Promote beta to latest
        id: publish_latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          npm_userconfig="$(mktemp)"
          trap 'rm -f "${npm_userconfig}"' EXIT
          chmod 0600 "${npm_userconfig}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${npm_userconfig}"
          NPM_CONFIG_USERCONFIG="${npm_userconfig}" npm dist-tag add "openclaw@${RELEASE_VERSION}" latest
          echo "latest_published=true" >> "$GITHUB_OUTPUT"
          promoted_latest="$(npm view openclaw dist-tags.latest)"
          if [[ "${promoted_latest}" != "${RELEASE_VERSION}" ]]; then
            echo "npm latest points at ${promoted_latest}, expected ${RELEASE_VERSION} after promotion." >&2
            exit 1
          fi
          echo "Promoted openclaw@${RELEASE_VERSION} from beta to latest."

      - name: Summarize beta promotion
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          {
            echo "## npm dist-tag output"
            echo
            echo "- Mode: \`promote_beta_to_latest\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Result: npm \`latest\` now points at this stable version"
          } >> "$GITHUB_STEP_SUMMARY"

  sync_stable_dist_tags:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync_stable_dist_tags' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest_published: ${{ steps.publish_latest.outputs.latest_published }}
    steps:
      - name: Require main workflow ref for dist-tag sync
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Dist-tag sync runs must be dispatched from main."
            exit 1
          fi

      - name: Validate stable tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "Manual dist-tag sync requires a stable release tag." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]; then
            echo "Invalid stable release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate public stable tag exists
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code "https://github.com/${OPENCLAW_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" >/dev/null; then
            echo "Public release tag ${RELEASE_TAG} not found in ${OPENCLAW_REPOSITORY}." >&2
            exit 1
          fi

      - name: Validate published stable version
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          if ! npm view "openclaw@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "openclaw@${RELEASE_VERSION} is not published on npm." >&2
            exit 1
          fi

          echo "Current latest dist-tag: $(npm view openclaw dist-tags.latest)"
          echo "Current beta dist-tag: $(npm view openclaw dist-tags.beta)"

      - name: Sync stable dist-tags
        id: publish_latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          npm_userconfig="$(mktemp)"
          trap 'rm -f "${npm_userconfig}"' EXIT
          chmod 0600 "${npm_userconfig}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${npm_userconfig}"
          NPM_CONFIG_USERCONFIG="${npm_userconfig}" npm dist-tag add "openclaw@${RELEASE_VERSION}" latest
          echo "latest_published=true" >> "$GITHUB_OUTPUT"

          synced_latest="$(npm view openclaw dist-tags.latest)"
          if [[ "${synced_latest}" != "${RELEASE_VERSION}" ]]; then
            echo "npm latest points at ${synced_latest}, expected ${RELEASE_VERSION} after sync." >&2
            exit 1
          fi
          echo "Synced openclaw@${RELEASE_VERSION} to npm latest; the beta floor runs next."

      - name: Summarize manual dist-tag sync
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          {
            echo "## npm dist-tag output"
            echo
            echo "- Mode: \`sync_stable_dist_tags\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Result: npm \`latest\` updated; the beta floor runs next"
          } >> "$GITHUB_STEP_SUMMARY"

  promote_extended_stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'promote_extended_stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate extended-stable promotion request
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
            echo "Extended-stable promotion must be dispatched from main." >&2
            exit 1
          fi
          # Promotion may select a newer or older published final version.
          # This moves an existing selector; it does not authorize new publication.
          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]{3}\.([1-9]|1[0-2])\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]; then
            echo "Extended-stable promotion requires an exact final release tag." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify extended-stable promotion target exists
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs "https://github.com/${OPENCLAW_REPOSITORY}.git" \
            "refs/tags/${RELEASE_TAG}" >/dev/null
          npm view "openclaw@${RELEASE_VERSION}" version --json --prefer-online \
            --registry=https://registry.npmjs.org/ | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const raw = JSON.parse(input);
                const version = Array.isArray(raw) && raw.length === 1 ? raw[0] : raw;
                if (version !== process.env.RELEASE_VERSION) {
                  throw new Error("Exact promotion version is not published on npm.");
                }
              });'

      - name: Promote and verify extended-stable npm tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Missing NPM_TOKEN secret." >&2
            exit 1
          fi
          npm_userconfig="$(mktemp)"
          trap 'rm -f "$npm_userconfig"' EXIT
          chmod 0600 "$npm_userconfig"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npm_userconfig"
          export NPM_CONFIG_USERCONFIG="$npm_userconfig"
          export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
          unset NODE_AUTH_TOKEN
          npm whoami >/dev/null
          read_selector() {
            npm view openclaw dist-tags --json --prefer-online --fetch-retries=0 --fetch-timeout=15000 | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const raw = JSON.parse(input);
                const tags = Array.isArray(raw) && raw.length === 1 ? raw[0] : raw;
                if (!tags || typeof tags !== "object" || Array.isArray(tags)) {
                  throw new Error("Invalid npm dist-tags response.");
                }
                const version = tags["extended-stable"];
                if (version !== undefined && typeof version !== "string") {
                  throw new Error("Invalid extended-stable selector.");
                }
                process.stdout.write(version ?? "<unset>");
              });'
          }
          previous="$(read_selector)"
          printf '### npm extended-stable promotion\n\n- Previous: `%s`\n- Target: `%s`\n' \
            "$previous" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$previous" != "$RELEASE_VERSION" ]]; then
            # Never retry the write: an error or timeout can follow a successful mutation.
            if ! npm dist-tag add "openclaw@${RELEASE_VERSION}" extended-stable; then
              echo '- Result: write failed or unconfirmed; inspect npm before retrying.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          # Allow five minutes of retry waits for npm read propagation.
          for ((attempt = 1; attempt <= 61; attempt++)); do
            if current="$(read_selector)" && [[ "$current" == "$RELEASE_VERSION" ]]; then
              echo '- Result: verified; latest, beta, and plugin selectors were not written.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( attempt < 61 )); then sleep 5; fi
          done
          echo '- Result: readback failed; the tag write may have succeeded. Inspect npm before retrying.' >> "$GITHUB_STEP_SUMMARY"
          echo "Extended-stable readback did not converge. Do not republish the package." >&2
          exit 1
