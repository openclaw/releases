name: OpenClaw macOS Variant

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      smoke_test_only:
        required: true
        type: boolean
      prepared_package_run_id:
        required: true
        type: string
      pretag_source_sha:
        required: true
        type: string
      public_release_branch:
        required: true
        type: string
      allow_late_calver_recovery:
        required: true
        type: boolean
      source_sha:
        required: true
        type: string
      checkpoint_supported:
        required: true
        type: string
      resume_plan:
        required: true
        type: string
      variant_json:
        required: true
        type: string
      build_needed:
        required: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.20.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  OPENCLAW_REPOSITORY: openclaw/openclaw
  EXPECTED_DEVELOPER_IDENTITY: "Developer ID Application: OpenClaw Foundation (FWJYW4S8P8)"
  EXPECTED_DEVELOPER_TEAM_ID: FWJYW4S8P8

jobs:
  build_and_sign:
    if: ${{ inputs.build_needed }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}]', inputs.variant_json)) }}
    # Release authorization covers signing and notarization; mac-release owns
    # the secrets and main-only deployment policy without a second approval.
    environment: ${{ !inputs.smoke_test_only && 'mac-release' || '' }}
    permissions:
      actions: read
      contents: read
    outputs:
      universal: ${{ steps.handoff.outputs.universal }}
      arm64: ${{ steps.handoff.outputs.arm64 }}
      x86_64: ${{ steps.handoff.outputs.x86_64 }}
    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Checkout pinned public source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/openclaw/openclaw.git source
          git -C source fetch origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Use native macOS 27 folder-image creation
        run: |
          mkdir -p "$RUNNER_TEMP/macos27-tools"
          ln -s "$GITHUB_WORKSPACE/release-tools/scripts/macos27-hdiutil.py" "$RUNNER_TEMP/macos27-tools/hdiutil"
          echo "$RUNNER_TEMP/macos27-tools" >> "$GITHUB_PATH"

      - name: Select packaging contract
        id: packaging
        env:
          CHECKPOINT_SUPPORTED: ${{ inputs.checkpoint_supported }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          {
            echo "supported=$CHECKPOINT_SUPPORTED"
            echo "source_sha=$SOURCE_SHA"
            echo "checkpoint_only=$CHECKPOINT_SUPPORTED"
            echo "complete=$([[ "$CHECKPOINT_SUPPORTED" == true ]] && echo false || echo true)"
            echo "needs_signing=true"
          } >> "$GITHUB_OUTPUT"
          if [[ "$CHECKPOINT_SUPPORTED" == false ]]; then
            echo "::notice::Source predates --checkpoint-only; using the single-job packaging path."
          fi

      - name: Checkout submodules (retry)
        working-directory: source
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule update failed (attempt $attempt/5). Retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: source
        run: |
          set -euo pipefail
          # Mirrors product CI: OpenClawChatUI bundles generated Mermaid resources
          # (scripts/prepare-apple-mermaid.mjs) that SwiftPM copies at build time.
          if [[ -f scripts/prepare-apple-mermaid.mjs ]]; then
            node scripts/prepare-apple-mermaid.mjs
          else
            echo "Source predates bundled Mermaid assets; nothing to prepare."
          fi

      - name: Ensure Rosetta for Intel runtime verification
        if: ${{ matrix.variant != 'arm64' }}
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Show image toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-release-${{ hashFiles('source/apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-release-

      - name: Resolve package version
        id: package_version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        id: release_channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint prepared package read token
        id: prepared_package_token
        if: ${{ inputs.prepared_package_run_id != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MACOS_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.MACOS_PUBLISHER_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: openclaw
          permission-actions: read

      - name: Download verified prepared package
        if: ${{ inputs.prepared_package_run_id != '' }}
        env:
          GH_TOKEN: ${{ steps.prepared_package_token.outputs.token }}
          PREPARED_PACKAGE_RUN_ID: ${{ inputs.prepared_package_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python3 release-tools/scripts/prepare-macos-package.py "$RUNNER_TEMP/prepared-release-package"

      - name: Release packaging guards
        working-directory: source
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          pnpm check:no-conflict-markers
          pnpm check:changelog-attributions
          pnpm check:host-env-policy:swift

      - name: Build and verify release contents
        working-directory: source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          PREPARED_PACKAGE_RUN_ID: ${{ inputs.prepared_package_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        # release:check owns the package build, including Control UI assets.
        run: |
          set -euo pipefail
          if [[ -z "$PREPARED_PACKAGE_RUN_ID" ]]; then
            pnpm release:check
            exit 0
          fi
          bundle="$RUNNER_TEMP/prepared-release-package"
          export OPENCLAW_RELEASE_CHECK_LOCAL_PACKAGE_TARBALL_DIR="$bundle/dependencies"
          pnpm release:check --tarball "$bundle/openclaw.tgz"

      - name: Validate release tag and package metadata
        working-directory: source
        env:
          ALLOW_LATE_CALVER_RECOVERY: ${{ inputs.allow_late_calver_recovery }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
        run: |
          set -euo pipefail
          if [[ "${PUBLIC_RELEASE_BRANCH}" != "main" && ! "${PUBLIC_RELEASE_BRANCH}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid public_release_branch: ${PUBLIC_RELEASE_BRANCH}" >&2
            exit 1
          fi
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_MAIN_REF="refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          export RELEASE_SHA RELEASE_TAG RELEASE_MAIN_REF
          git fetch --no-tags origin "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          check_log="${RUNNER_TEMP}/openclaw-npm-release-check.log"
          if pnpm release:openclaw:npm:check 2>&1 | tee "${check_log}"; then
            exit 0
          fi
          if [[ "${ALLOW_LATE_CALVER_RECOVERY}" != "true" ]] || ! grep -Fq "must be within" "${check_log}"; then
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          npm_json="$(npm view "openclaw@${package_version}" version dist.tarball dist.integrity --json)"
          printf '%s' "${npm_json}" | PACKAGE_VERSION="${package_version}" node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const version = process.env.PACKAGE_VERSION;
            if (data.version !== version || !data["dist.tarball"] || !data["dist.integrity"]) {
              console.error(`Published npm metadata for openclaw@${version} is incomplete.`);
              process.exit(1);
            }
          '
          echo "::warning::Allowing late mac-only recovery for ${RELEASE_TAG}; published npm metadata for openclaw@${package_version} is present."

      - name: Package macOS smoke-test artifacts
        id: package_smoke
        if: ${{ inputs.smoke_test_only }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          ALLOW_ADHOC_SIGNING: "1"
          BUNDLE_ID: ai.openclaw.mac
          BUILD_ARCHS: ${{ matrix.build_archs }}
          BUILD_CONFIG: release
          CODESIGN_TIMESTAMP: "off"
          SKIP_NOTARIZE: "1"
          SKIP_PNPM_INSTALL: "1"
          SKIP_TSC: "1"
          SKIP_UI_BUILD: "1"
          SPARKLE_FEED_URL: ${{ matrix.feed_url }}
          CHECKPOINT_ONLY: ${{ steps.packaging.outputs.checkpoint_only }}
        run: |
          set -euo pipefail
          if [[ "$CHECKPOINT_ONLY" == true ]]; then
            python3 ../release-tools/scripts/run-macos-package.py checkpoint
          else
            python3 ../release-tools/scripts/run-macos-package.py package
          fi

      - &import_signing
        name: Import Developer ID certificate
        if: ${{ !inputs.smoke_test_only && steps.packaging.outputs.needs_signing == 'true' }}
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/openclaw-macos-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openclaw-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export CERT_PATH MACOS_DEVELOPER_ID_P12_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_DEVELOPER_ID_P12_BASE64"])
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - &signing_identity
        name: Resolve signing identity
        if: ${{ !inputs.smoke_test_only && steps.packaging.outputs.needs_signing == 'true' }}
        run: |
          set -euo pipefail
          SIGN_IDENTITIES="$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" 2>/dev/null | awk -F'\"' -v expected="$EXPECTED_DEVELOPER_IDENTITY" '$2 == expected { print $2 }')"
          SIGN_IDENTITY_COUNT="$(printf '%s\n' "$SIGN_IDENTITIES" | awk 'NF { count++ } END { print count + 0 }')"
          if [[ "$SIGN_IDENTITY_COUNT" != "1" ]]; then
            echo "Expected exactly one OpenClaw Foundation Developer ID identity; found ${SIGN_IDENTITY_COUNT}." >&2
            exit 1
          fi
          SIGN_IDENTITY="$SIGN_IDENTITIES"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - &notary_keys
        name: Write notary and Sparkle key files
        if: ${{ steps.packaging.outputs.complete == 'true' && !inputs.smoke_test_only }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          NOTARYTOOL_KEY_PATH="$RUNNER_TEMP/openclaw-notary.p8"
          SPARKLE_PRIVATE_KEY_PATH="$RUNNER_TEMP/openclaw-sparkle-ed25519.pem"
          export NOTARYTOOL_KEY_PATH SPARKLE_PRIVATE_KEY_PATH
          python3 - <<'PY'
          import os
          from pathlib import Path

          def write_secret(path_env: str, value_env: str) -> None:
              value = os.environ[value_env].replace("\\n", "\n")
              Path(os.environ[path_env]).write_text(value, encoding="utf-8")

          write_secret("NOTARYTOOL_KEY_PATH", "APP_STORE_CONNECT_API_KEY_P8")
          write_secret("SPARKLE_PRIVATE_KEY_PATH", "SPARKLE_PRIVATE_KEY")
          PY
          echo "NOTARYTOOL_KEY=$NOTARYTOOL_KEY_PATH" >> "$GITHUB_ENV"
          echo "NOTARYTOOL_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARYTOOL_ISSUER=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_FILE=$SPARKLE_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

      - name: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'Build and sign macOS checkpoint (no Apple submission)' || 'Build, sign, notarize, and package macOS release (legacy source)' }}
        id: package_release
        if: ${{ !inputs.smoke_test_only }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          BUNDLE_ID: ai.openclaw.mac
          BUILD_ARCHS: ${{ matrix.build_archs }}
          BUILD_CONFIG: release
          SIGN_IDENTITY: ${{ env.SIGN_IDENTITY }}
          SKIP_PNPM_INSTALL: "1"
          SKIP_TSC: "1"
          SKIP_UI_BUILD: "1"
          SPARKLE_FEED_URL: ${{ matrix.feed_url }}
          CHECKPOINT_ONLY: ${{ steps.packaging.outputs.checkpoint_only }}
        run: |
          set -euo pipefail
          if [[ "$CHECKPOINT_ONLY" == true ]]; then
            python3 ../release-tools/scripts/run-macos-package.py checkpoint
          else
            python3 ../release-tools/scripts/run-macos-package.py package
          fi

      - name: Preserve notarization recovery checkpoint
        id: recovery_checkpoint
        if: ${{ always() && (contains(fromJSON('["success", "failure", "cancelled"]'), steps.package_release.outcome) || (steps.packaging.outputs.checkpoint_only == 'true' && steps.package_smoke.outcome == 'success')) && hashFiles('source/dist/macos-notarization-recovery/manifest.json') != '' }}
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
        run: |
          set -euo pipefail
          checkpoint=dist/macos-notarization-recovery
          python3 scripts/lib/mac-notarization-recovery.py verify "$checkpoint" \
            "$(git rev-parse HEAD)" "$(node -p "require('./package.json').version")" >/dev/null
          if [[ ! -f "$checkpoint/sparkle-tools.zip" ]]; then
            tool=""
            # Prefer the producer host's artifact, matching make_appcast.sh.
            # Follow SwiftPM's build/cache links when collecting the full tool bundle.
            for build_root in "apps/macos/.build/$(uname -m)" apps/macos/.build; do
              if [[ -d "$build_root" ]]; then
                tool="$(find -L "$build_root" -type f -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' -print -quit)"
                [[ -z "$tool" ]] || break
              fi
            done
            [[ -n "$tool" ]] || { echo "Missing producer Sparkle tools for recovery." >&2; exit 1; }
            ditto -c -k --sequesterRsrc --keepParent "$(dirname "$(dirname "$tool")")" "$checkpoint/sparkle-tools.zip"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const data = { releaseTag: process.env.RELEASE_TAG,
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            producerRunId: Number(process.env.GITHUB_RUN_ID), producerRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            producerWorkflowSha: process.env.GITHUB_SHA, preflightOnly: true, smokeTestOnly: process.env.SMOKE_TEST_ONLY === 'true' };
          fs.writeFileSync('dist/macos-notarization-recovery/workflow-release.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE
          python3 scripts/lib/mac-notarization-recovery.py seal "$checkpoint"

      - &upload_checkpoint
        name: Upload notarization recovery checkpoint
        if: ${{ always() && steps.recovery_checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'macos-signed' || 'macos-notarization' }}-${{ inputs.tag }}${{ matrix.artifact_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/dist/macos-notarization-recovery
          if-no-files-found: error
          retention-days: 30

      - &write_resume_index
        name: Write resume index
        if: ${{ always() && steps.recovery_checkpoint.outcome == 'success' && !inputs.smoke_test_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
          SOURCE_SHA: ${{ steps.packaging.outputs.source_sha }}
          CHECKPOINT_ARTIFACT: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'macos-signed' || 'macos-notarization' }}-${{ inputs.tag }}${{ matrix.artifact_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_PREFIX: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'macos-signed' || 'macos-notarization' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          const data = { schemaVersion: 1, releaseTag: e.RELEASE_TAG, variant: e.ARTIFACT_VARIANT,
            sourceSha: e.SOURCE_SHA, checkpointArtifact: e.CHECKPOINT_ARTIFACT, artifactPrefix: e.ARTIFACT_PREFIX,
            producerRunId: Number(e.GITHUB_RUN_ID), producerRunAttempt: Number(e.GITHUB_RUN_ATTEMPT),
            producerWorkflowSha: e.GITHUB_SHA };
          fs.mkdirSync(`${e.RUNNER_TEMP}/macos-resume`, { recursive: true });
          fs.writeFileSync(`${e.RUNNER_TEMP}/macos-resume/resume.json`, `${JSON.stringify(data)}\n`);
          NODE

      - &upload_resume_index
        name: Upload resume index
        if: ${{ always() && steps.recovery_checkpoint.outcome == 'success' && !inputs.smoke_test_only }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-resume-${{ inputs.tag }}-${{ matrix.variant }}-${{ steps.packaging.outputs.source_sha }}
          path: ${{ runner.temp }}/macos-resume/resume.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - &package_output_0
        name: Name architecture-specific artifacts
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          [[ -n "$ARTIFACT_SUFFIX" ]] || exit 0
          for extension in zip dmg dSYM.zip; do
            source="dist/OpenClaw-${APP_VERSION}.${extension}"
            destination="dist/OpenClaw-${APP_VERSION}${ARTIFACT_SUFFIX}.${extension}"
            [[ -f "$source" ]] || { echo "Missing packaged output: $source" >&2; exit 1; }
            mv "$source" "$destination"
          done

      - &package_output_1
        name: Verify packaged OpenClaw signing identity
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only) }}
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          EXPECTED_ARCHS: ${{ matrix.build_archs }}
          EXPECTED_BUNDLE_ID: ai.openclaw.mac
        run: |
          set -euo pipefail
          ZIP_PATH="source/dist/OpenClaw-${APP_VERSION}${ARTIFACT_SUFFIX}.zip"
          DMG_PATH="source/dist/OpenClaw-${APP_VERSION}${ARTIFACT_SUFFIX}.dmg"
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT

          ditto -x -k "$ZIP_PATH" "$VERIFY_ROOT"
          APP_PATH="$VERIFY_ROOT/OpenClaw.app"
          [[ -d "$APP_PATH" ]] || { echo "OpenClaw.app missing from packaged zip." >&2; exit 1; }

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          APP_SIGNATURE="$(/usr/bin/codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          grep -Fqx "Authority=${EXPECTED_DEVELOPER_IDENTITY}" <<<"$APP_SIGNATURE"
          grep -Fqx "TeamIdentifier=${EXPECTED_DEVELOPER_TEAM_ID}" <<<"$APP_SIGNATURE"
          APP_BUNDLE_ID="$(defaults read "$APP_PATH/Contents/Info" CFBundleIdentifier)"
          [[ "$APP_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "Unexpected bundle identifier: ${APP_BUNDLE_ID}" >&2
            exit 1
          }
          ACTUAL_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/OpenClaw")"
          CUA_ARCHS="$(lipo -archs "$APP_PATH/Contents/Resources/cua-driver")"
          if [[ "$EXPECTED_ARCHS" == "all" ]]; then
            [[ "$ACTUAL_ARCHS" == *arm64* && "$ACTUAL_ARCHS" == *x86_64* ]] || {
              echo "Universal app is missing an architecture: ${ACTUAL_ARCHS}" >&2
              exit 1
            }
            [[ "$CUA_ARCHS" == *arm64* && "$CUA_ARCHS" == *x86_64* ]] || {
              echo "Universal CUA driver is missing an architecture: ${CUA_ARCHS}" >&2
              exit 1
            }
          else
            [[ "$ACTUAL_ARCHS" == "$EXPECTED_ARCHS" ]] || {
              echo "Thin app architecture mismatch: expected ${EXPECTED_ARCHS}, got ${ACTUAL_ARCHS}" >&2
              exit 1
            }
            [[ "$CUA_ARCHS" == "$EXPECTED_ARCHS" ]] || {
              echo "Thin CUA architecture mismatch: expected ${EXPECTED_ARCHS}, got ${CUA_ARCHS}" >&2
              exit 1
            }
          fi
          spctl -a -vv -t exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          /usr/bin/codesign --verify --strict --verbose=2 "$DMG_PATH"
          DMG_SIGNATURE="$(/usr/bin/codesign -dv --verbose=4 "$DMG_PATH" 2>&1)"
          grep -Fqx "Authority=${EXPECTED_DEVELOPER_IDENTITY}" <<<"$DMG_SIGNATURE"
          grep -Fqx "TeamIdentifier=${EXPECTED_DEVELOPER_TEAM_ID}" <<<"$DMG_SIGNATURE"
          spctl -a -vv -t open --context context:primary-signature "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - &package_output_2
        name: Seed appcast from public main
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        run: |
          set -euo pipefail
          if curl -fsSL "${{ matrix.feed_url }}" -o source/appcast.xml; then
            echo "Seeded appcast from ${{ matrix.feed_url }}."
          else
            rm -f source/appcast.xml
            echo "No existing appcast at ${{ matrix.feed_url }}; generating a fresh feed."
          fi

      - &package_output_3
        name: Generate signed appcast artifact
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        working-directory: source
        env:
          SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/openclaw/openclaw/releases/download/${{ inputs.tag }}/
          SPARKLE_RELEASE_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          scripts/make_appcast.sh \
            "dist/OpenClaw-${{ steps.package_version.outputs.value }}${{ matrix.artifact_suffix }}.zip" \
            "${{ matrix.feed_url }}"
          if [[ "${{ matrix.appcast_name }}" != appcast.xml ]]; then
            mv appcast.xml "${{ matrix.appcast_name }}"
          fi

      - &package_output_4
        name: Resolve packaged artifact name
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: packaged_artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
        run: |
          set -euo pipefail
          if [[ "$SMOKE_TEST_ONLY" == "true" ]]; then
            echo "value=macos-smoke-${RELEASE_TAG}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=macos-preflight-${RELEASE_TAG}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          fi

      - &package_output_5
        name: Resolve packaged file paths
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: packaged_files
        run: |
          set -euo pipefail
          VERSION="${{ steps.package_version.outputs.value }}"
          SUFFIX="${{ matrix.artifact_suffix }}"
          ZIP_PATH="source/dist/OpenClaw-${VERSION}${SUFFIX}.zip"
          DMG_PATH="source/dist/OpenClaw-${VERSION}${SUFFIX}.dmg"
          DSYM_PATH="source/dist/OpenClaw-${VERSION}${SUFFIX}.dSYM.zip"
          for path in "$ZIP_PATH" "$DMG_PATH" "$DSYM_PATH"; do
            [[ -f "$path" ]] || { echo "Missing packaged output: $path" >&2; exit 1; }
          done
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dsym=$DSYM_PATH" >> "$GITHUB_OUTPUT"

      - &package_output_6
        name: Resolve appcast path
        id: appcast_path
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ZIP_PATH: ${{ steps.packaged_files.outputs.zip }}
          APPCAST_NAME: ${{ matrix.appcast_name }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          APPCAST_PATH="source/${APPCAST_NAME}"
          if [[ -z "$APPCAST_PATH" || ! -f "$APPCAST_PATH" ]]; then
            echo "Stable appcast artifact not found." >&2
            exit 1
          fi
          python3 release-tools/scripts/verify-macos-appcast.py "$APPCAST_PATH" "$ZIP_PATH" \
            "$RELEASE_TAG" "$OPENCLAW_REPOSITORY" "$ARTIFACT_VARIANT"
          echo "path=$APPCAST_PATH" >> "$GITHUB_OUTPUT"

      - &package_output_7
        name: Resolve packaged version
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: packaged_version
        run: |
          set -euo pipefail
          VERSION="${{ steps.package_version.outputs.value }}"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve packaged version from zip filename." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - &package_output_8
        name: Upload stable appcast artifact
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-appcast-${{ inputs.tag }}-${{ matrix.variant }}
          path: ${{ steps.appcast_path.outputs.path }}
          overwrite: true
          if-no-files-found: error

      - &package_output_9
        name: Skip signed appcast for smoke tests
        if: ${{ steps.packaging.outputs.complete == 'true' && (inputs.smoke_test_only) }}
        run: echo "Smoke-test mode enabled; skip shared production appcast artifact generation."

      - &package_output_10
        name: Skip shared appcast for beta releases
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta == 'true') }}
        run: echo "Beta release detected; skip shared production appcast artifact generation."

      - &package_output_11
        name: Capture release provenance
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: release_provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git -C source rev-parse HEAD)"
          # Provenance must sit beside the packaged outputs: upload-artifact roots the
          # artifact at the common ancestor of every path, and the collector expects flat files.
          # It is written AFTER packaging: the packaging step may rebuild the JS bundle, and
          # tsdown cleans dist/ on a cache miss, which deleted these files in run 35969970230.
          ARTIFACT_DIR="source/dist"
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' "$RELEASE_TAG" > "$ARTIFACT_DIR/release-tag-${ARTIFACT_VARIANT}.txt"
          printf '%s\n' "$RELEASE_SHA" > "$ARTIFACT_DIR/release-sha-${ARTIFACT_VARIANT}.txt"
          echo "dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - &package_output_12
        name: Upload packaged macOS artifacts
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packaged_artifacts.outputs.value }}
          path: |
            ${{ steps.packaged_files.outputs.zip }}
            ${{ steps.packaged_files.outputs.dmg }}
            ${{ steps.packaged_files.outputs.dsym }}
            ${{ steps.release_provenance.outputs.dir }}/release-tag-${{ matrix.variant }}.txt
            ${{ steps.release_provenance.outputs.dir }}/release-sha-${{ matrix.variant }}.txt
          overwrite: true
          if-no-files-found: error

      - &package_output_13
        name: Summarize follow-up
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
          ARTIFACT_NAME: ${{ steps.packaged_artifacts.outputs.value }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          IS_BETA: ${{ steps.release_channel.outputs.is_beta }}
        run: |
          set -euo pipefail
          {
            echo "## macOS workflow output"
            echo
            echo "- Packaged artifacts: \`${ARTIFACT_NAME}\`"
            echo "- Version: \`${VERSION}\`"
            echo
            if [[ "$SMOKE_TEST_ONLY" == "true" ]]; then
              echo "This was a smoke-test run. Artifacts are ad-hoc signed, not notarized, and not suitable for release readiness."
            else
              echo "This was a preflight run. Inspect the packaged artifacts before any real publish run."
            fi
            echo
            if [[ "$SMOKE_TEST_ONLY" == "true" ]]; then
              echo "Smoke-test mode skips production Sparkle appcast generation."
            elif [[ "$IS_BETA" != "true" ]]; then
              echo "For stable releases, promote these artifacts after validation. Promotion opens an appcast PR; feed publication remains pending until that PR merges."
            else
              echo "Beta release detected; no production Sparkle appcasts are generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - &clean_signing
        name: Clean up signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi

      - name: Export immutable variant handoff
        id: handoff
        env:
          ARTIFACT_VARIANT: ${{ matrix.variant }}
          SOURCE_SHA: ${{ steps.packaging.outputs.source_sha }}
          CHECKPOINT_SUPPORTED: ${{ steps.packaging.outputs.supported }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          const data = { sourceSha: e.SOURCE_SHA, supported: e.CHECKPOINT_SUPPORTED === 'true',
            mode: e.CHECKPOINT_SUPPORTED === 'true' ? 'checkpoint' : 'legacy',
            runId: e.GITHUB_RUN_ID, attempt: e.GITHUB_RUN_ATTEMPT };
          fs.appendFileSync(e.GITHUB_OUTPUT, `${e.ARTIFACT_VARIANT}=${JSON.stringify(data)}\n`);
          NODE

  notarize_and_package:
    needs: build_and_sign
    if: ${{ !cancelled() && (needs.build_and_sign.result == 'success' || needs.build_and_sign.result == 'skipped') }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{0}]', inputs.variant_json)) }}
    # Release authorization covers signing and notarization; mac-release owns
    # the secrets and main-only deployment policy without a second approval.
    environment: ${{ !inputs.smoke_test_only && 'mac-release' || '' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Select immutable variant handoff
        id: packaging
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CHECKPOINT_SUPPORTED: ${{ inputs.checkpoint_supported }}
          HANDOFF: ${{ needs.build_and_sign.outputs[matrix.variant] }}
          RESUME_PLAN: ${{ inputs.resume_plan }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          const plan = (JSON.parse(e.RESUME_PLAN || '{}'))[e.ARTIFACT_VARIANT];
          const manual = Boolean(plan);
          if (manual && !['macos-notarization', 'macos-signed'].includes(plan.prefix)) {
            throw new Error('Invalid checkpoint artifact prefix');
          }
          const data = manual ? { mode: 'manual', sourceSha: e.EXPECTED_SOURCE_SHA,
            supported: e.CHECKPOINT_SUPPORTED === 'true', runId: plan.runId, attempt: plan.attempt }
            : JSON.parse(e.HANDOFF);
          if (!/^[a-f0-9]{40}$/.test(data.sourceSha) || typeof data.supported !== 'boolean' ||
              !['manual', 'checkpoint', 'legacy'].includes(data.mode) ||
              !/^[1-9][0-9]*$/.test(data.runId) || !/^[1-9][0-9]*$/.test(data.attempt)) {
            throw new Error('Invalid build handoff');
          }
          if (data.sourceSha !== e.EXPECTED_SOURCE_SHA || data.supported !== (e.CHECKPOINT_SUPPORTED === 'true') || (data.mode === 'manual') !== manual ||
              (!manual && (data.runId !== e.GITHUB_RUN_ID || Number(data.attempt) > Number(e.GITHUB_RUN_ATTEMPT))) ||
              (!manual && (data.mode === 'checkpoint') !== data.supported)) {
            throw new Error('Build handoff run, attempt or mode mismatch');
          }
          const resume = data.mode !== 'legacy';
          const outputs = { complete: resume, checkpoint_only: false, manual,
            needs_signing: manual && !data.supported, source_sha: data.sourceSha,
            run_id: data.runId, attempt: data.attempt,
            artifact_prefix: manual ? plan.prefix : 'macos-signed' };
          for (const [key, value] of Object.entries(outputs)) {
            fs.appendFileSync(e.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          if (!resume) console.log('Legacy source: build_and_sign already packaged this variant.');
          NODE

      - name: Checkout release verification tools
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Checkout checkpoint source
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        env:
          SOURCE_SHA: ${{ steps.packaging.outputs.source_sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/openclaw/openclaw.git source
          git -C source fetch origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Use native macOS 27 folder-image creation
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/macos27-tools"
          ln -s "$GITHUB_WORKSPACE/release-tools/scripts/macos27-hdiutil.py" "$RUNNER_TEMP/macos27-tools/hdiutil"
          echo "$RUNNER_TEMP/macos27-tools" >> "$GITHUB_PATH"

      - name: Setup Node.js
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ensure Rosetta for Intel runtime verification
        if: ${{ matrix.variant != 'arm64' }}
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Show image toolchain
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package version
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: package_version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: release_channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify notarization checkpoint producer
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RECOVERY: ${{ steps.packaging.outputs.manual }}
          RESUME_RUN_ID: ${{ steps.packaging.outputs.run_id }}
          RESUME_RUN_ATTEMPT: ${{ steps.packaging.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL_RECOVERY" != true ]]; then
            node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          fs.writeFileSync(`${e.RUNNER_TEMP}/notarization-producer.json`, JSON.stringify({
            id: Number(e.RESUME_RUN_ID), run_attempt: Number(e.RESUME_RUN_ATTEMPT), head_sha: e.GITHUB_SHA }));
          NODE
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/attempts/${RESUME_RUN_ATTEMPT}" > "$RUNNER_TEMP/notarization-producer.json"
          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/notarization-producer.json`, 'utf8'));
          const expected = {
            id: Number(process.env.RESUME_RUN_ID), run_attempt: Number(process.env.RESUME_RUN_ATTEMPT),
            path: '.github/workflows/openclaw-macos-publish.yml', head_branch: 'main',
            event: 'workflow_dispatch', status: 'completed',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (run[key] !== value) throw new Error(`Recovery producer ${key} must equal ${value}`);
          }
          if (run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
              !['failure', 'cancelled'].includes(run.conclusion) || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
            throw new Error('Recovery requires a failed or cancelled signed preflight in this repository');
          }
          NODE

      - name: Download notarization checkpoint
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.packaging.outputs.artifact_prefix }}-${{ inputs.tag }}${{ matrix.artifact_suffix }}-${{ steps.packaging.outputs.run_id }}-${{ steps.packaging.outputs.attempt }}
          path: source/dist/macos-notarization-recovery
          repository: ${{ github.repository }}
          run-id: ${{ steps.packaging.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify notarization checkpoint release binding
        id: recovery_verified
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        env:
          PRETAG_SOURCE_SHA: ${{ inputs.pretag_source_sha }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          MANUAL_RECOVERY: ${{ steps.packaging.outputs.manual }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
          EXPECTED_FEED_URL: ${{ matrix.feed_url }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/lib/mac-notarization-recovery.py ]] || ! grep -Fq -- '--resume-notarization' scripts/package-mac-dist.sh; then
            echo "Selected source does not support notarization recovery. Refusing to rebuild; use source containing the recovery interface." >&2
            exit 1
          fi
          if [[ "$PUBLIC_RELEASE_BRANCH" != main && ! "$PUBLIC_RELEASE_BRANCH" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid public release branch." >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          if [[ -n "$PRETAG_SOURCE_SHA" ]]; then
            [[ "$(git rev-parse HEAD)" == "$PRETAG_SOURCE_SHA" ]]
            if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "$PRETAG_SOURCE_SHA" ]]
            fi
          else
            git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" HEAD
          fi
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const root = 'dist/macos-notarization-recovery';
          const envelope = JSON.parse(fs.readFileSync(`${root}/workflow-release.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`, 'utf8'));
          const producer = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/notarization-producer.json`, 'utf8'));
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const expected = { releaseTag: process.env.RELEASE_TAG, sourceSha, producerRunId: producer.id,
            producerRunAttempt: producer.run_attempt, producerWorkflowSha: producer.head_sha,
            preflightOnly: true, smokeTestOnly: process.env.SMOKE_TEST_ONLY === 'true' };
          for (const [key, value] of Object.entries(expected)) {
            if (envelope[key] !== value) throw new Error(`Recovery checkpoint ${key} mismatch`);
          }
          if (manifest.schemaVersion !== 1 || manifest.sourceSha !== sourceSha || manifest.version !== version ||
              manifest.skipDmg !== false || manifest.skipDsym !== false) {
            throw new Error('Recovery checkpoint source, version or release packaging flags mismatch');
          }
          NODE
          python3 scripts/lib/mac-notarization-recovery.py verify dist/macos-notarization-recovery \
            "$(git rev-parse HEAD)" "$(node -p "require('./package.json').version")" >/dev/null
          if [[ "$MANUAL_RECOVERY" != true ]]; then
            [[ -f dist/macos-notarization-recovery/app.dmg ]] || { echo "Build checkpoint lacks signed DMG." >&2; exit 1; }
          fi
          # Existing checkpoints have no variant field. Bind the matrix to the
          # feed already protected by the signed app and checkpoint hash.
          python3 <<'PY'
          import os, plistlib, zipfile
          with zipfile.ZipFile('dist/macos-notarization-recovery/app.zip') as archive:
              name = 'OpenClaw.app/Contents/Info.plist'
              if archive.namelist().count(name) != 1:
                  raise ValueError('Recovery checkpoint must contain one app Info.plist')
              info = plistlib.loads(archive.read(name))
              if info.get('SUFeedURL') != os.environ['EXPECTED_FEED_URL']:
                  raise ValueError('Recovery checkpoint app feed does not match the selected variant')
          PY

      - *import_signing

      - *signing_identity

      - *notary_keys

      - name: Resume notarization and package macOS artifacts
        id: package_release
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          BUNDLE_ID: ai.openclaw.mac
          BUILD_ARCHS: ${{ matrix.build_archs }}
          BUILD_CONFIG: release
          SPARKLE_FEED_URL: ${{ matrix.feed_url }}
          ALLOW_ADHOC_SIGNING: ${{ inputs.smoke_test_only && '1' || '0' }}
          SKIP_NOTARIZE: ${{ inputs.smoke_test_only && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 ../release-tools/scripts/run-macos-package.py resume

      - name: Preserve notarization recovery checkpoint
        id: recovery_checkpoint
        if: ${{ always() && steps.recovery_verified.outcome == 'success' && steps.package_release.outcome != 'skipped' && hashFiles('source/dist/macos-notarization-recovery/manifest.json') != '' }}
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
        run: |
          set -euo pipefail
          checkpoint=dist/macos-notarization-recovery
          python3 scripts/lib/mac-notarization-recovery.py verify "$checkpoint" \
            "$(git rev-parse HEAD)" "$(node -p "require('./package.json').version")" >/dev/null
          if [[ ! -f "$checkpoint/sparkle-tools.zip" ]]; then
            tool=""
            # Prefer the producer host's artifact, matching make_appcast.sh.
            # Follow SwiftPM's build/cache links when collecting the full tool bundle.
            for build_root in "apps/macos/.build/$(uname -m)" apps/macos/.build; do
              if [[ -d "$build_root" ]]; then
                tool="$(find -L "$build_root" -type f -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' -print -quit)"
                [[ -z "$tool" ]] || break
              fi
            done
            [[ -n "$tool" ]] || { echo "Missing producer Sparkle tools for recovery." >&2; exit 1; }
            ditto -c -k --sequesterRsrc --keepParent "$(dirname "$(dirname "$tool")")" "$checkpoint/sparkle-tools.zip"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const data = { releaseTag: process.env.RELEASE_TAG,
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            producerRunId: Number(process.env.GITHUB_RUN_ID), producerRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            producerWorkflowSha: process.env.GITHUB_SHA, preflightOnly: true, smokeTestOnly: process.env.SMOKE_TEST_ONLY === 'true' };
          fs.writeFileSync('dist/macos-notarization-recovery/workflow-release.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE
          python3 scripts/lib/mac-notarization-recovery.py seal "$checkpoint"

      - *upload_checkpoint
      - *write_resume_index
      - *upload_resume_index

      - name: Restore checkpointed Sparkle tools
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        run: |
          set -euo pipefail
          python3 <<'PY'
          import posixpath, stat, zipfile
          with zipfile.ZipFile('dist/macos-notarization-recovery/sparkle-tools.zip') as archive:
              for member in archive.infolist():
                  name = member.filename
                  if name.startswith('/') or '..' in name.split('/') or not name.startswith(('Sparkle/', '__MACOSX/')):
                      raise ValueError('Unexpected Sparkle archive path')
                  if stat.S_ISLNK(member.external_attr >> 16):
                      target = archive.read(member).decode()
                      resolved = posixpath.normpath(posixpath.join(posixpath.dirname(name), target))
                      if target.startswith('/') or not resolved.startswith('Sparkle/'):
                          raise ValueError('Sparkle archive symlink escapes root')
          PY
          ditto -x -k dist/macos-notarization-recovery/sparkle-tools.zip "$RUNNER_TEMP/recovery-sparkle"
          tool="$RUNNER_TEMP/recovery-sparkle/Sparkle/bin/generate_appcast"
          [[ -x "$tool" ]] || { echo "Recovered Sparkle generator is missing." >&2; exit 1; }
