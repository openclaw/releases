name: OpenClaw macOS Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OpenClaw release tag to package (for example v2026.3.22 or v2026.3.22-beta.1)
        required: true
        type: string
      pretag_source_sha:
        description: Exact signed stable release branch head for artifact-only preparation before tagging; leave empty for normal tagged releases
        required: false
        type: string
      source_ref:
        description: Optional public openclaw/openclaw source ref to build instead of the tag, for release-branch-only packaging fixes after npm/tag publication
        required: false
        type: string
      prepared_package_run_id:
        description: Successful public FRV npm artifact run for this exact tag and source; validate sealed package bytes instead of repacking against moving registry tags
        required: false
        type: string
      preflight_only:
        description: Build, sign, notarize, and package only; skip uploading assets to the public GitHub release
        required: true
        default: false
        type: boolean
      smoke_test_only:
        description: Use ad-hoc packaging only; skip Apple signing, notarization, and shared appcast generation for workflow smoke tests
        required: true
        default: false
        type: boolean
      ignore_checkpoints:
        description: Build every variant fresh even when a resumable checkpoint exists for this tag and source
        required: true
        default: false
        type: boolean
      preflight_run_id:
        description: Existing successful mac preflight workflow run id to promote without rebuilding or renotarizing
        required: false
        type: string
      validate_run_id:
        description: Existing successful mac validate workflow run id to prove the required swift test gate passed for this tag
        required: false
        type: string
      resume_notarization_run_id:
        description: Failed signed preflight run containing a notarization recovery checkpoint; resumes without compiling the app again
        required: false
        type: string
      resume_notarization_run_attempt:
        description: Exact attempt of the failed preflight that uploaded the recovery checkpoint
        required: false
        type: string
      resume_notarization_variant:
        description: Checkpoints to pin; unselected variants use automatic checkpoint discovery
        required: true
        default: universal
        type: choice
        options:
          - universal
          - arm64
          - x86_64
          - all
      allow_late_calver_recovery:
        description: Allow mac-only recovery after the npm CalVer freshness window, while still verifying the published npm package exists
        required: true
        default: false
        type: boolean
      public_release_branch:
        description: Public openclaw/openclaw branch that contains the release tag commit
        required: false
        default: main
        type: string

concurrency:
  group: ${{ inputs.smoke_test_only && format('openclaw-macos-smoke-{0}-{1}-{2}', github.ref, inputs.tag, inputs.source_ref) || format('openclaw-macos-publish-{0}', contains(inputs.tag, '-beta.') && inputs.tag || 'stable-feed') }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_REPOSITORY: openclaw/openclaw

jobs:
  prepare:
    outputs:
      reuse_preflight: ${{ steps.reuse_preflight.outputs.value }}
      source_sha: ${{ steps.source.outputs.sha }}
      checkpoint_supported: ${{ steps.source.outputs.supported }}
      build_matrix: ${{ steps.source.outputs.build_matrix }}
      package_matrix: ${{ steps.source.outputs.package_matrix }}
      build_needed: ${{ steps.source.outputs.build_needed }}
      resume_plan: ${{ steps.source.outputs.resume_plan }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Forbid pretag artifact promotion
        if: ${{ inputs.pretag_source_sha != '' && (!inputs.preflight_only || inputs.smoke_test_only || inputs.source_ref != '' || inputs.resume_notarization_run_id != '' || github.ref != 'refs/heads/main') }}
        run: |
          echo "Pretag source is only valid for fresh signed artifact-only preparation from main." >&2
          exit 1

      - name: Validate notarization recovery inputs
        env:
          RESUME_RUN_ID: ${{ inputs.resume_notarization_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_notarization_run_attempt }}
          RESUME_VARIANT: ${{ inputs.resume_notarization_variant }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$RESUME_VARIANT" in
            universal|arm64|x86_64|all) ;;
            *) echo "Invalid notarization recovery variant." >&2; exit 1 ;;
          esac
          if [[ -z "$RESUME_RUN_ID" && -z "$RESUME_RUN_ATTEMPT" ]]; then
            [[ "$RESUME_VARIANT" == universal ]] || { echo "A recovery variant requires a run id and exact attempt." >&2; exit 1; }
            exit 0
          fi
          if [[ ! "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$RESUME_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Recovery requires a positive run id and exact run attempt." >&2
            exit 1
          fi
          if [[ "$PREFLIGHT_ONLY" != true || "$SMOKE_TEST_ONLY" != false || "$WORKFLOW_REF" != refs/heads/main ]]; then
            echo "Notarization recovery requires a signed preflight dispatched from main." >&2
            exit 1
          fi

      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Require main workflow ref for real publish
        if: ${{ !inputs.preflight_only }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Real publish runs must be dispatched from main. Use preflight_only=true for branch validation."
            exit 1
          fi

      - name: Forbid smoke-test mode on real publish
        if: ${{ inputs.smoke_test_only && !inputs.preflight_only }}
        run: |
          echo "smoke_test_only=true is only valid with preflight_only=true."
          exit 1

      - name: Forbid preflight artifact promotion on validation-only runs
        if: ${{ inputs.preflight_only && inputs.preflight_run_id != '' }}
        run: |
          echo "preflight_run_id is only valid for real publish runs."
          exit 1

      - name: Forbid validation run reuse on validation-only runs
        if: ${{ inputs.preflight_only && inputs.validate_run_id != '' }}
        run: |
          echo "validate_run_id is only valid for real publish runs."
          exit 1

      - name: Require preflight artifact promotion on real publish
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.preflight_run_id }}" ]]; then
            echo "Real publish requires preflight_run_id from a successful mac preflight run." >&2
            exit 1
          fi

      - name: Require mac validation run on real publish
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.validate_run_id }}" ]]; then
            echo "Real publish requires validate_run_id from a successful mac validation run." >&2
            exit 1
          fi

      - name: Resolve preflight artifact reuse mode
        id: reuse_preflight
        env:
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "${PREFLIGHT_RUN_ID}" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release verification tools
        if: ${{ steps.reuse_preflight.outputs.value != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Admit signed pretag source
        if: ${{ steps.reuse_preflight.outputs.value != 'true' && inputs.pretag_source_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRETAG_SOURCE_SHA: ${{ inputs.pretag_source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_REF: ${{ github.ref }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          RESUME_RUN_ID: ${{ inputs.resume_notarization_run_id }}
        run: |
          python3 release-tools/scripts/checkout-macos-pretag.py

      - name: Clone selected public source
        if: ${{ steps.reuse_preflight.outputs.value != 'true' && inputs.pretag_source_sha == '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone https://github.com/openclaw/openclaw.git source
          git -C source rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          if [[ -z "${SOURCE_REF}" ]]; then
            git -C source checkout --detach "refs/tags/${RELEASE_TAG}"
            exit 0
          fi
          if [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            git -C source fetch origin "${SOURCE_REF}"
            git -C source checkout --detach "${SOURCE_REF}"
            exit 0
          fi
          if [[ "${SOURCE_REF}" != "main" && ! "${SOURCE_REF}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid source_ref: ${SOURCE_REF}" >&2
            exit 1
          fi
          git -C source fetch origin "+refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          git -C source checkout --detach "refs/remotes/origin/${SOURCE_REF}"

      - name: Pin packaging source and variants
        id: source
        if: ${{ steps.reuse_preflight.outputs.value != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_RUN_ID: ${{ inputs.resume_notarization_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_notarization_run_attempt }}
          RESUME_VARIANT: ${{ inputs.resume_notarization_variant }}
          IGNORE_CHECKPOINTS: ${{ inputs.ignore_checkpoints }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          PRETAG_SOURCE_SHA: ${{ inputs.pretag_source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          python3 release-tools/scripts/resume-macos-checkpoints.py

  prepare_variants:
    needs: prepare
    if: ${{ needs.prepare.outputs.reuse_preflight != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    # Each reusable invocation owns one build -> notarization chain. A slow
    # sibling no longer delays this variant's Apple submission.
    uses: ./.github/workflows/openclaw-macos-variant.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      smoke_test_only: ${{ inputs.smoke_test_only }}
      prepared_package_run_id: ${{ inputs.prepared_package_run_id }}
      pretag_source_sha: ${{ inputs.pretag_source_sha }}
      public_release_branch: ${{ inputs.public_release_branch }}
      allow_late_calver_recovery: ${{ inputs.allow_late_calver_recovery }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      checkpoint_supported: ${{ needs.prepare.outputs.checkpoint_supported }}
      resume_plan: ${{ needs.prepare.outputs.resume_plan }}
      variant_json: ${{ toJSON(matrix) }}
      build_needed: ${{ contains(fromJSON(needs.prepare.outputs.build_matrix).include.*.variant, matrix.variant) }}

  collect_preflight_artifacts:
    needs: [prepare, prepare_variants]
    if: ${{ !cancelled() && needs.prepare.outputs.reuse_preflight != 'true' && needs.prepare_variants.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed preflight variants
        if: ${{ !inputs.smoke_test_only }}
        uses: actions/download-artifact@v8
        with:
          pattern: macos-preflight-${{ inputs.tag }}-*
          path: collected-artifacts
          merge-multiple: true

      - name: Download smoke-test variants
        if: ${{ inputs.smoke_test_only }}
        uses: actions/download-artifact@v8
        with:
          pattern: macos-smoke-${{ inputs.tag }}-*
          path: collected-artifacts
          merge-multiple: true

      - name: Verify complete macOS artifact set
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for suffix in "" -arm64 -x86_64; do
            for extension in zip dmg dSYM.zip; do
              path="collected-artifacts/OpenClaw-${version}${suffix}.${extension}"
              [[ -f "$path" ]] || { echo "Missing macOS artifact variant: $path" >&2; exit 1; }
            done
          done
          release_sha=""
          for variant in universal arm64 x86_64; do
            tag_file="collected-artifacts/release-tag-${variant}.txt"
            sha_file="collected-artifacts/release-sha-${variant}.txt"
            [[ "$(tr -d '\r\n' < "$tag_file")" == "$RELEASE_TAG" ]] || {
              echo "macOS ${variant} artifact tag mismatch." >&2
              exit 1
            }
            variant_sha="$(tr -d '\r\n' < "$sha_file")"
            [[ "$variant_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "macOS ${variant} artifact SHA is invalid." >&2
              exit 1
            }
            if [[ -n "$release_sha" && "$variant_sha" != "$release_sha" ]]; then
              echo "macOS artifact variants were built from different source commits." >&2
              exit 1
            fi
            release_sha="$variant_sha"
          done
          cp collected-artifacts/release-tag-universal.txt collected-artifacts/release-tag.txt
          cp collected-artifacts/release-sha-universal.txt collected-artifacts/release-sha.txt

      - name: Upload complete macOS preflight artifact
        if: ${{ !inputs.smoke_test_only }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-preflight-${{ inputs.tag }}
          path: collected-artifacts
          overwrite: true
          if-no-files-found: error

      - name: Upload complete macOS smoke artifact
        if: ${{ inputs.smoke_test_only }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-smoke-${{ inputs.tag }}
          path: collected-artifacts
          overwrite: true
          if-no-files-found: error

      - name: Download architecture-specific appcasts
        if: ${{ !inputs.smoke_test_only && !contains(inputs.tag, '-beta.') }}
        uses: actions/download-artifact@v8
        with:
          pattern: macos-appcast-${{ inputs.tag }}-*
          path: collected-appcasts
          merge-multiple: true

      - name: Verify complete appcast set
        if: ${{ !inputs.smoke_test_only && !contains(inputs.tag, '-beta.') }}
        run: |
          set -euo pipefail
          for name in appcast.xml appcast-arm64.xml appcast-x86_64.xml; do
            [[ -f "collected-appcasts/$name" ]] || { echo "Missing macOS appcast: $name" >&2; exit 1; }
          done

      - name: Upload complete appcast artifact
        if: ${{ !inputs.smoke_test_only && !contains(inputs.tag, '-beta.') }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-appcast-${{ inputs.tag }}
          path: collected-appcasts
          overwrite: true
          if-no-files-found: error

  promote_release_artifacts:
    needs: prepare
    if: ${{ !inputs.preflight_only && !inputs.smoke_test_only }}
    runs-on: ubuntu-latest
    # Final promotion is independently environment-gated, just like npm publish.
    environment: mac-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@v7
        with:
          path: release-tools
          persist-credentials: false

      - name: Ensure matching GitHub release exists (draft or public)
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN secret." >&2
            exit 1
          fi
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$OPENCLAW_REPOSITORY" --json tagName,isDraft,url)"
          printf '%s' "$RELEASE_JSON" | node -e 'const fs = require("node:fs"); const release = JSON.parse(fs.readFileSync(0, "utf8")); if (release.tagName !== process.env.RELEASE_TAG) throw new Error("GitHub release tag does not match requested tag"); console.log(`Attaching to ${release.isDraft ? "draft" : "public"} release ${release.url}; the npm publisher flips it public.`);'

      - name: Determine release channel
        id: release_channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify preflight run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,event,conclusion,url)"
          printf '%s' "$RUN_JSON" | node -e 'const fs = require("node:fs"); const run = JSON.parse(fs.readFileSync(0, "utf8")); const checks = [["workflowName", "OpenClaw macOS Publish"], ["headBranch", "main"], ["event", "workflow_dispatch"], ["conclusion", "success"]]; for (const [key, expected] of checks) { if (run[key] !== expected) { console.error(`Referenced mac preflight run ${process.env.PREFLIGHT_RUN_ID} must have ${key}=${expected}, got ${run[key] ?? "<missing>"}.`); process.exit(1); } } console.log(`Using mac preflight run ${process.env.PREFLIGHT_RUN_ID}: ${run.url}`);'

      - name: Verify validate run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RUN_ID: ${{ inputs.validate_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run view "$VALIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,event,conclusion,url)"
          printf '%s' "$RUN_JSON" | node -e 'const fs = require("node:fs"); const run = JSON.parse(fs.readFileSync(0, "utf8")); const checks = [["workflowName", "OpenClaw macOS Validate"], ["headBranch", "main"], ["event", "workflow_dispatch"], ["conclusion", "success"]]; for (const [key, expected] of checks) { if (run[key] !== expected) { console.error(`Referenced mac validation run ${process.env.VALIDATE_RUN_ID} must have ${key}=${expected}, got ${run[key] ?? "<missing>"}.`); process.exit(1); } } console.log(`Using mac validation run ${process.env.VALIDATE_RUN_ID}: ${run.url}`);'

      - name: Resolve expected public release commit
        id: expected_release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_RELEASE_SHA=""
          while IFS=$'\t' read -r oid ref; do
            if [[ "$ref" == "refs/tags/${RELEASE_TAG}^{}" ]]; then
              EXPECTED_RELEASE_SHA="$oid"
              break
            fi
            if [[ "$ref" == "refs/tags/${RELEASE_TAG}" ]]; then
              EXPECTED_RELEASE_SHA="$oid"
            fi
          done < <(git ls-remote https://github.com/openclaw/openclaw.git "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          if [[ -z "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Unable to resolve public tag commit for ${RELEASE_TAG}." >&2
            exit 1
          fi
          echo "sha=$EXPECTED_RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download prepared macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-preflight-${{ inputs.tag }}
          path: promoted-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}

      - name: Verify prepared macOS artifact provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ steps.expected_release.outputs.sha }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
        run: |
          set -euo pipefail
          TAG_FILE="$(find promoted-artifacts -type f -name 'release-tag.txt' -print | sort | tail -n 1)"
          SHA_FILE="$(find promoted-artifacts -type f -name 'release-sha.txt' -print | sort | tail -n 1)"
          if [[ -z "$TAG_FILE" || -z "$SHA_FILE" || ! -f "$TAG_FILE" || ! -f "$SHA_FILE" ]]; then
            echo "Prepared macOS preflight metadata is missing." >&2
            ls -la promoted-artifacts >&2 || true
            exit 1
          fi
          ARTIFACT_RELEASE_TAG="$(tr -d '\r\n' < "$TAG_FILE")"
          ARTIFACT_RELEASE_SHA="$(tr -d '\r\n' < "$SHA_FILE")"
          if [[ "$ARTIFACT_RELEASE_TAG" != "$RELEASE_TAG" ]]; then
            echo "Prepared macOS preflight tag mismatch: expected $RELEASE_TAG, got $ARTIFACT_RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$ARTIFACT_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            if [[ "${PUBLIC_RELEASE_BRANCH}" != "main" && ! "${PUBLIC_RELEASE_BRANCH}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
              echo "Invalid public_release_branch: ${PUBLIC_RELEASE_BRANCH}" >&2
              exit 1
            fi
            git init public-source
            git -C public-source remote add origin https://github.com/openclaw/openclaw.git
            git -C public-source fetch --filter=blob:none --depth=200 origin \
              "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
              "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
            RESOLVED_TAG_SHA="$(git -C public-source rev-parse "refs/tags/${RELEASE_TAG}^{}")"
            if [[ "$RESOLVED_TAG_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
              echo "Resolved tag SHA changed while verifying artifacts: expected $EXPECTED_RELEASE_SHA, got $RESOLVED_TAG_SHA" >&2
              exit 1
            fi
            if ! git -C public-source merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" "$ARTIFACT_RELEASE_SHA"; then
              echo "Prepared macOS preflight SHA $ARTIFACT_RELEASE_SHA is not a descendant of release tag $RELEASE_TAG ($EXPECTED_RELEASE_SHA)." >&2
              exit 1
            fi
            if ! git -C public-source merge-base --is-ancestor "$ARTIFACT_RELEASE_SHA" "refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"; then
              echo "Prepared macOS preflight SHA $ARTIFACT_RELEASE_SHA is not contained in ${PUBLIC_RELEASE_BRANCH}." >&2
              exit 1
            fi
          fi

      - name: Download prepared stable appcast artifact
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: macos-appcast-${{ inputs.tag }}
          path: promoted-appcast
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}

      - name: Download validation proof artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-validate-${{ inputs.tag }}
          path: promoted-validation
          repository: ${{ github.repository }}
          run-id: ${{ inputs.validate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify validation artifact provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ steps.expected_release.outputs.sha }}
        run: |
          set -euo pipefail
          PREFLIGHT_SHA_FILE="$(find promoted-artifacts -type f -name 'release-sha.txt' -print | sort | tail -n 1)"
          TAG_FILE="$(find promoted-validation -type f -name 'release-tag.txt' -print | sort | tail -n 1)"
          SHA_FILE="$(find promoted-validation -type f -name 'release-sha.txt' -print | sort | tail -n 1)"
          if [[ -z "$PREFLIGHT_SHA_FILE" || -z "$TAG_FILE" || -z "$SHA_FILE" || ! -f "$PREFLIGHT_SHA_FILE" || ! -f "$TAG_FILE" || ! -f "$SHA_FILE" ]]; then
            echo "Validation proof metadata is missing." >&2
            ls -la promoted-validation >&2 || true
            exit 1
          fi
          PREFLIGHT_RELEASE_SHA="$(tr -d '\r\n' < "$PREFLIGHT_SHA_FILE")"
          VALIDATION_RELEASE_TAG="$(tr -d '\r\n' < "$TAG_FILE")"
          VALIDATION_RELEASE_SHA="$(tr -d '\r\n' < "$SHA_FILE")"
          if [[ "$VALIDATION_RELEASE_TAG" != "$RELEASE_TAG" ]]; then
            echo "Validation proof tag mismatch: expected $RELEASE_TAG, got $VALIDATION_RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$VALIDATION_RELEASE_SHA" != "$PREFLIGHT_RELEASE_SHA" ]]; then
            echo "Validation proof SHA mismatch: expected preflight source $PREFLIGHT_RELEASE_SHA, got $VALIDATION_RELEASE_SHA" >&2
            exit 1
          fi

      - name: Resolve packaged artifact name
        id: packaged_artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "value=macos-release-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve packaged file paths
        id: packaged_files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SEARCH_DIR="promoted-artifacts"
          VERSION="${RELEASE_TAG#v}"
          for variant in universal arm64 x86_64; do
            suffix=""
            [[ "$variant" == universal ]] || suffix="-$variant"
            for kind in zip dmg dsym; do
              extension="$kind"
              [[ "$kind" == dsym ]] && extension="dSYM.zip"
              path="$SEARCH_DIR/OpenClaw-${VERSION}${suffix}.${extension}"
              [[ -f "$path" ]] || { echo "Missing packaged output: $path" >&2; exit 1; }
              echo "${variant}_${kind}=$path" >> "$GITHUB_OUTPUT"
            done
          done

      - name: Resolve appcast path
        id: appcast_path
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UNIVERSAL_ZIP: ${{ steps.packaged_files.outputs.universal_zip }}
          ARM64_ZIP: ${{ steps.packaged_files.outputs.arm64_zip }}
          X86_64_ZIP: ${{ steps.packaged_files.outputs.x86_64_zip }}
        run: |
          set -euo pipefail
          for variant in universal arm64 x86_64; do
            case "$variant" in
              universal) name=appcast.xml; zip="$UNIVERSAL_ZIP" ;;
              arm64) name=appcast-arm64.xml; zip="$ARM64_ZIP" ;;
              x86_64) name=appcast-x86_64.xml; zip="$X86_64_ZIP" ;;
            esac
            path="promoted-appcast/$name"
            [[ -f "$path" ]] || { echo "Stable appcast artifact not found: $name" >&2; exit 1; }
            python3 release-tools/scripts/verify-macos-appcast.py "$path" "$zip" \
              "$RELEASE_TAG" "$OPENCLAW_REPOSITORY" "$variant"
            echo "${variant}=$path" >> "$GITHUB_OUTPUT"
          done

      - name: Resolve packaged version
        id: packaged_version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve packaged version from zip filename." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload stable appcast artifact
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-appcast-${{ inputs.tag }}
          path: |
            ${{ steps.appcast_path.outputs.universal }}
            ${{ steps.appcast_path.outputs.arm64 }}
            ${{ steps.appcast_path.outputs.x86_64 }}
          if-no-files-found: error

      - name: Skip shared appcast for beta releases
        if: ${{ steps.release_channel.outputs.is_beta == 'true' }}
        run: echo "Beta release detected; skip shared production appcast artifact generation."

      - name: Upload packaged macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packaged_artifacts.outputs.value }}
          path: |
            ${{ steps.packaged_files.outputs.universal_zip }}
            ${{ steps.packaged_files.outputs.universal_dmg }}
            ${{ steps.packaged_files.outputs.universal_dsym }}
            ${{ steps.packaged_files.outputs.arm64_zip }}
            ${{ steps.packaged_files.outputs.arm64_dmg }}
            ${{ steps.packaged_files.outputs.arm64_dsym }}
            ${{ steps.packaged_files.outputs.x86_64_zip }}
            ${{ steps.packaged_files.outputs.x86_64_dmg }}
            ${{ steps.packaged_files.outputs.x86_64_dsym }}
          if-no-files-found: error

      - name: Upload packaged macOS assets to public GitHub release
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN secret." >&2
            exit 1
          fi
          assets=()
          for suffix in "" -arm64 -x86_64; do
            for extension in zip dmg dSYM.zip; do
              assets+=("promoted-artifacts/OpenClaw-${VERSION}${suffix}.${extension}")
            done
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$OPENCLAW_REPOSITORY"

      - name: Verify public GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
        run: |
          set -euo pipefail
          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --repo "$OPENCLAW_REPOSITORY" --json assets --jq '.assets[].name')"
          for suffix in "" -arm64 -x86_64; do
            for extension in zip dmg dSYM.zip; do
              asset_name="OpenClaw-${VERSION}${suffix}.${extension}"
              if ! printf '%s\n' "$ASSET_NAMES" | grep -Fqx "$asset_name"; then
                echo "Expected release asset not found after upload: $asset_name" >&2
                exit 1
              fi
            done
          done

      - name: Publish stable appcast to public main
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
          UNIVERSAL_APPCAST: ${{ steps.appcast_path.outputs.universal }}
          ARM64_APPCAST: ${{ steps.appcast_path.outputs.arm64 }}
          X86_64_APPCAST: ${{ steps.appcast_path.outputs.x86_64 }}
          UNIVERSAL_ZIP: ${{ steps.packaged_files.outputs.universal_zip }}
          ARM64_ZIP: ${{ steps.packaged_files.outputs.arm64_zip }}
          X86_64_ZIP: ${{ steps.packaged_files.outputs.x86_64_zip }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          VALIDATE_RUN_ID: ${{ inputs.validate_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN secret." >&2
            exit 1
          fi
          for path in "$UNIVERSAL_APPCAST" "$ARM64_APPCAST" "$X86_64_APPCAST"; do
            [[ -f "$path" ]] || { echo "Stable appcast path is missing: $path" >&2; exit 1; }
          done
          universal_source="$(realpath "$UNIVERSAL_APPCAST")"
          arm64_source="$(realpath "$ARM64_APPCAST")"
          x86_64_source="$(realpath "$X86_64_APPCAST")"

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          source_sha="$(tr -d '\r\n' < promoted-artifacts/release-sha.txt)"
          body_file="${workdir}/appcast-pr.md"
          {
            cat <<EOF
          ## What Problem This Solves

          Mac users need the stable Sparkle feeds to advertise the signed ${RELEASE_TAG} assets. This publishes the prepared universal, arm64, and x86_64 appcasts instead of leaving in-app update discovery on the previous feed revision.

          ## Why This Change Was Made

          The native publisher reuses the signed preflight artifacts; this promotion does not rebuild, sign, or notarize them. Only the three generated appcast XML files change. Release source: ${source_sha}.

          ## User Impact

          Compatible Mac clients can discover ${RELEASE_TAG} through their existing architecture-specific feed. Compatibility requirements and signatures come from the prepared feeds without modification; no updater code, configuration, or release-source changes are made here.

          ## Evidence

          - [Signed macOS preflight](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN_ID}): successful; prepared all three architectures.
          - [Swift validation](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${VALIDATE_RUN_ID}): successful; validation tag and source match the prepared artifacts.
          - [Native promotion](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}): artifact provenance and appcast-to-ZIP identity checks passed; all nine asset names verified on the [release](https://github.com/${OPENCLAW_REPOSITORY}/releases/tag/${RELEASE_TAG}). This run may still be in progress when the PR opens.
          - Appcast checks cover packaged version/build, variant feed URL, release download URL, ZIP length, and Ed25519 signature presence, not independent cryptographic verification.
          - Public main feed readback remains pending until this PR lands. No installed Sparkle-client upgrade is claimed.

          ### Prepared artifact identities (SHA-256)

          These hashes identify the exact prepared feeds and signed ZIPs used by promotion.

          ~~~text
          EOF
            sha256sum "$UNIVERSAL_APPCAST" "$ARM64_APPCAST" "$X86_64_APPCAST" \
              "$UNIVERSAL_ZIP" "$ARM64_ZIP" "$X86_64_ZIP"
            echo '~~~'
          } > "$body_file"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OPENCLAW_REPOSITORY}.git" "${workdir}/openclaw"
          cd "${workdir}/openclaw"
          git config user.name "openclaw-release-bot"
          git config user.email "release-bot@openclaw.ai"
          cp "$universal_source" appcast.xml
          cp "$arm64_source" appcast-arm64.xml
          cp "$x86_64_source" appcast-x86_64.xml

          if git diff --quiet -- appcast.xml appcast-arm64.xml appcast-x86_64.xml; then
            echo "Public main already has every macOS appcast for ${RELEASE_TAG}."
            exit 0
          fi

          git add appcast.xml appcast-arm64.xml appcast-x86_64.xml
          git commit -m "chore(release): update appcast for ${VERSION}"
          if git push origin HEAD:main; then
            echo "Published appcast.xml directly to public main for ${RELEASE_TAG}."
            exit 0
          fi

          branch="release/appcast-${RELEASE_TAG#v}"
          git push --force-with-lease origin HEAD:"${branch}"
          pr_url="$(gh pr list --repo "${OPENCLAW_REPOSITORY}" --head "${branch}" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "${pr_url}" ]]; then
            pr_url="$(gh pr create \
              --repo "${OPENCLAW_REPOSITORY}" \
              --head "${branch}" \
              --base main \
              --title "chore(release): update appcast for ${VERSION}" \
              --body-file "$body_file")"
          else
            gh pr edit "$pr_url" --repo "${OPENCLAW_REPOSITORY}" --body-file "$body_file"
          fi
          echo "Direct main push was blocked; opened appcast PR: ${pr_url}"

      - name: Summarize follow-up
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
          ARTIFACT_NAME: ${{ steps.packaged_artifacts.outputs.value }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          IS_BETA: ${{ steps.release_channel.outputs.is_beta }}
        run: |
          set -euo pipefail
          {
            echo "## macOS workflow output"
            echo
            echo "- Packaged artifacts: \`${ARTIFACT_NAME}\`"
            echo "- Version: \`${VERSION}\`"
            echo
            echo "This real publish reused preflight artifacts from run \`${PREFLIGHT_RUN_ID}\`; no rebuild, signing, or notarization work ran in this publish job."
            echo "Assets are attached to the GitHub release, which may still be a draft; the core npm publisher flips it public."
            echo
            if [[ "$IS_BETA" != "true" ]]; then
              echo "Stable appcast publish runs automatically after public release assets are verified. If direct \`main\` push is blocked, the workflow opens or updates an appcast PR."
            else
              echo "Beta release detected; no shared production \`appcast.xml\` artifact is generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
