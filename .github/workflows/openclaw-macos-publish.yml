name: OpenClaw macOS Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OpenClaw release tag to package (for example v2026.3.22 or v2026.3.22-beta.1)
        required: true
        type: string
      pretag_source_sha:
        description: Exact signed stable release branch head for artifact-only preparation before tagging; leave empty for normal tagged releases
        required: false
        type: string
      source_ref:
        description: Optional public openclaw/openclaw source ref to build instead of the tag, for release-branch-only packaging fixes after npm/tag publication
        required: false
        type: string
      preflight_only:
        description: Build, sign, notarize, and package only; skip uploading assets to the public GitHub release
        required: true
        default: false
        type: boolean
      smoke_test_only:
        description: Use ad-hoc packaging only; skip Apple signing, notarization, and shared appcast generation for workflow smoke tests
        required: true
        default: false
        type: boolean
      ignore_checkpoints:
        description: Build every variant fresh even when a resumable checkpoint exists for this tag and source
        required: true
        default: false
        type: boolean
      preflight_run_id:
        description: Existing successful mac preflight workflow run id to promote without rebuilding or renotarizing
        required: false
        type: string
      validate_run_id:
        description: Existing successful mac validate workflow run id to prove the required swift test gate passed for this tag
        required: false
        type: string
      resume_notarization_run_id:
        description: Failed signed preflight run containing a notarization recovery checkpoint; resumes without compiling the app again
        required: false
        type: string
      resume_notarization_run_attempt:
        description: Exact attempt of the failed preflight that uploaded the recovery checkpoint
        required: false
        type: string
      resume_notarization_variant:
        description: Checkpoints to pin; unselected variants use automatic checkpoint discovery
        required: true
        default: universal
        type: choice
        options:
          - universal
          - arm64
          - x86_64
          - all
      allow_late_calver_recovery:
        description: Allow mac-only recovery after the npm CalVer freshness window, while still verifying the published npm package exists
        required: true
        default: false
        type: boolean
      public_release_branch:
        description: Public openclaw/openclaw branch that contains the release tag commit
        required: false
        default: main
        type: string

concurrency:
  group: ${{ inputs.smoke_test_only && format('openclaw-macos-smoke-{0}-{1}-{2}', github.ref, inputs.tag, inputs.source_ref) || format('openclaw-macos-publish-{0}', contains(inputs.tag, '-beta.') && inputs.tag || 'stable-feed') }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.20.0"
  OPENCLAW_REPOSITORY: openclaw/openclaw
  EXPECTED_DEVELOPER_IDENTITY: "Developer ID Application: OpenClaw Foundation (FWJYW4S8P8)"
  EXPECTED_DEVELOPER_TEAM_ID: FWJYW4S8P8
  SPARKLE_FEED_URL: https://raw.githubusercontent.com/openclaw/openclaw/main/appcast.xml

jobs:
  prepare:
    outputs:
      reuse_preflight: ${{ steps.reuse_preflight.outputs.value }}
      source_sha: ${{ steps.source.outputs.sha }}
      checkpoint_supported: ${{ steps.source.outputs.supported }}
      build_matrix: ${{ steps.source.outputs.build_matrix }}
      package_matrix: ${{ steps.source.outputs.package_matrix }}
      build_needed: ${{ steps.source.outputs.build_needed }}
      resume_plan: ${{ steps.source.outputs.resume_plan }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Forbid pretag artifact promotion
        if: ${{ inputs.pretag_source_sha != '' && (!inputs.preflight_only || inputs.smoke_test_only || inputs.source_ref != '' || inputs.resume_notarization_run_id != '' || github.ref != 'refs/heads/main') }}
        run: |
          echo "Pretag source is only valid for fresh signed artifact-only preparation from main." >&2
          exit 1

      - name: Validate notarization recovery inputs
        env:
          RESUME_RUN_ID: ${{ inputs.resume_notarization_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_notarization_run_attempt }}
          RESUME_VARIANT: ${{ inputs.resume_notarization_variant }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$RESUME_VARIANT" in
            universal|arm64|x86_64|all) ;;
            *) echo "Invalid notarization recovery variant." >&2; exit 1 ;;
          esac
          if [[ -z "$RESUME_RUN_ID" && -z "$RESUME_RUN_ATTEMPT" ]]; then
            [[ "$RESUME_VARIANT" == universal ]] || { echo "A recovery variant requires a run id and exact attempt." >&2; exit 1; }
            exit 0
          fi
          if [[ ! "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$RESUME_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "Recovery requires a positive run id and exact run attempt." >&2
            exit 1
          fi
          if [[ "$PREFLIGHT_ONLY" != true || "$SMOKE_TEST_ONLY" != false || "$WORKFLOW_REF" != refs/heads/main ]]; then
            echo "Notarization recovery requires a signed preflight dispatched from main." >&2
            exit 1
          fi

      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Require main workflow ref for real publish
        if: ${{ !inputs.preflight_only }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Real publish runs must be dispatched from main. Use preflight_only=true for branch validation."
            exit 1
          fi

      - name: Forbid smoke-test mode on real publish
        if: ${{ inputs.smoke_test_only && !inputs.preflight_only }}
        run: |
          echo "smoke_test_only=true is only valid with preflight_only=true."
          exit 1

      - name: Forbid preflight artifact promotion on validation-only runs
        if: ${{ inputs.preflight_only && inputs.preflight_run_id != '' }}
        run: |
          echo "preflight_run_id is only valid for real publish runs."
          exit 1

      - name: Forbid validation run reuse on validation-only runs
        if: ${{ inputs.preflight_only && inputs.validate_run_id != '' }}
        run: |
          echo "validate_run_id is only valid for real publish runs."
          exit 1

      - name: Require preflight artifact promotion on real publish
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.preflight_run_id }}" ]]; then
            echo "Real publish requires preflight_run_id from a successful mac preflight run." >&2
            exit 1
          fi

      - name: Require mac validation run on real publish
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.validate_run_id }}" ]]; then
            echo "Real publish requires validate_run_id from a successful mac validation run." >&2
            exit 1
          fi

      - name: Resolve preflight artifact reuse mode
        id: reuse_preflight
        env:
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "${PREFLIGHT_RUN_ID}" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release verification tools
        if: ${{ steps.reuse_preflight.outputs.value != 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Admit signed pretag source
        if: ${{ steps.reuse_preflight.outputs.value != 'true' && inputs.pretag_source_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRETAG_SOURCE_SHA: ${{ inputs.pretag_source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_REF: ${{ github.ref }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          RESUME_RUN_ID: ${{ inputs.resume_notarization_run_id }}
        run: |
          python3 release-tools/scripts/checkout-macos-pretag.py

      - name: Clone selected public source
        if: ${{ steps.reuse_preflight.outputs.value != 'true' && inputs.pretag_source_sha == '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone https://github.com/openclaw/openclaw.git source
          git -C source rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          if [[ -z "${SOURCE_REF}" ]]; then
            git -C source checkout --detach "refs/tags/${RELEASE_TAG}"
            exit 0
          fi
          if [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            git -C source fetch origin "${SOURCE_REF}"
            git -C source checkout --detach "${SOURCE_REF}"
            exit 0
          fi
          if [[ "${SOURCE_REF}" != "main" && ! "${SOURCE_REF}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid source_ref: ${SOURCE_REF}" >&2
            exit 1
          fi
          git -C source fetch origin "+refs/heads/${SOURCE_REF}:refs/remotes/origin/${SOURCE_REF}"
          git -C source checkout --detach "refs/remotes/origin/${SOURCE_REF}"

      - name: Pin packaging source and variants
        id: source
        if: ${{ steps.reuse_preflight.outputs.value != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RESUME_RUN_ID: ${{ inputs.resume_notarization_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_notarization_run_attempt }}
          RESUME_VARIANT: ${{ inputs.resume_notarization_variant }}
          IGNORE_CHECKPOINTS: ${{ inputs.ignore_checkpoints }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          PRETAG_SOURCE_SHA: ${{ inputs.pretag_source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          python3 release-tools/scripts/resume-macos-checkpoints.py

  build_and_sign:
    needs: prepare
    if: ${{ needs.prepare.outputs.reuse_preflight != 'true' && needs.prepare.outputs.build_needed == 'true' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    # Release authorization covers signing and notarization; mac-release owns
    # the secrets and main-only deployment policy without a second approval.
    environment: ${{ !inputs.smoke_test_only && 'mac-release' || '' }}
    permissions:
      actions: read
      contents: read
    outputs:
      universal: ${{ steps.handoff.outputs.universal }}
      arm64: ${{ steps.handoff.outputs.arm64 }}
      x86_64: ${{ steps.handoff.outputs.x86_64 }}
    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Checkout pinned public source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/openclaw/openclaw.git source
          git -C source fetch origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Select packaging contract
        id: packaging
        env:
          CHECKPOINT_SUPPORTED: ${{ needs.prepare.outputs.checkpoint_supported }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          {
            echo "supported=$CHECKPOINT_SUPPORTED"
            echo "source_sha=$SOURCE_SHA"
            echo "checkpoint_only=$CHECKPOINT_SUPPORTED"
            echo "complete=$([[ "$CHECKPOINT_SUPPORTED" == true ]] && echo false || echo true)"
            echo "needs_signing=true"
          } >> "$GITHUB_OUTPUT"
          if [[ "$CHECKPOINT_SUPPORTED" == false ]]; then
            echo "::notice::Source predates --checkpoint-only; using the single-job packaging path."
          fi

      - name: Checkout submodules (retry)
        working-directory: source
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule update failed (attempt $attempt/5). Retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple Mermaid assets
        working-directory: source
        run: |
          set -euo pipefail
          # Mirrors product CI: OpenClawChatUI bundles generated Mermaid resources
          # (scripts/prepare-apple-mermaid.mjs) that SwiftPM copies at build time.
          if [[ -f scripts/prepare-apple-mermaid.mjs ]]; then
            node scripts/prepare-apple-mermaid.mjs
          else
            echo "Source predates bundled Mermaid assets; nothing to prepare."
          fi

      - name: Select release toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-release-${{ hashFiles('source/apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-release-

      - name: Resolve package version
        id: package_version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        id: release_channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release packaging guards
        working-directory: source
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          pnpm check:no-conflict-markers
          pnpm check:changelog-attributions
          pnpm check:host-env-policy:swift

      - name: Build and verify release contents
        working-directory: source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        # release:check owns the package build, including Control UI assets.
        run: pnpm release:check

      - name: Validate release tag and package metadata
        working-directory: source
        env:
          ALLOW_LATE_CALVER_RECOVERY: ${{ inputs.allow_late_calver_recovery }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
        run: |
          set -euo pipefail
          if [[ "${PUBLIC_RELEASE_BRANCH}" != "main" && ! "${PUBLIC_RELEASE_BRANCH}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid public_release_branch: ${PUBLIC_RELEASE_BRANCH}" >&2
            exit 1
          fi
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_MAIN_REF="refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          export RELEASE_SHA RELEASE_TAG RELEASE_MAIN_REF
          git fetch --no-tags origin "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          check_log="${RUNNER_TEMP}/openclaw-npm-release-check.log"
          if pnpm release:openclaw:npm:check 2>&1 | tee "${check_log}"; then
            exit 0
          fi
          if [[ "${ALLOW_LATE_CALVER_RECOVERY}" != "true" ]] || ! grep -Fq "must be within" "${check_log}"; then
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          npm_json="$(npm view "openclaw@${package_version}" version dist.tarball dist.integrity --json)"
          printf '%s' "${npm_json}" | PACKAGE_VERSION="${package_version}" node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const version = process.env.PACKAGE_VERSION;
            if (data.version !== version || !data["dist.tarball"] || !data["dist.integrity"]) {
              console.error(`Published npm metadata for openclaw@${version} is incomplete.`);
              process.exit(1);
            }
          '
          echo "::warning::Allowing late mac-only recovery for ${RELEASE_TAG}; published npm metadata for openclaw@${package_version} is present."

      - name: Package macOS smoke-test artifacts
        id: package_smoke
        if: ${{ inputs.smoke_test_only }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          ALLOW_ADHOC_SIGNING: "1"
          BUNDLE_ID: ai.openclaw.mac
          BUILD_ARCHS: ${{ matrix.build_archs }}
          BUILD_CONFIG: release
          CODESIGN_TIMESTAMP: "off"
          SKIP_NOTARIZE: "1"
          SKIP_PNPM_INSTALL: "1"
          SKIP_TSC: "1"
          SKIP_UI_BUILD: "1"
          SPARKLE_FEED_URL: ${{ matrix.feed_url }}
          CHECKPOINT_ONLY: ${{ steps.packaging.outputs.checkpoint_only }}
        run: |
          set -euo pipefail
          if [[ "$CHECKPOINT_ONLY" == true ]]; then
            scripts/package-mac-dist.sh --checkpoint-only
          else
            scripts/package-mac-dist.sh
          fi

      - &import_signing
        name: Import Developer ID certificate
        if: ${{ !inputs.smoke_test_only && steps.packaging.outputs.needs_signing == 'true' }}
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/openclaw-macos-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openclaw-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export CERT_PATH MACOS_DEVELOPER_ID_P12_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_DEVELOPER_ID_P12_BASE64"])
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - &signing_identity
        name: Resolve signing identity
        if: ${{ !inputs.smoke_test_only && steps.packaging.outputs.needs_signing == 'true' }}
        run: |
          set -euo pipefail
          SIGN_IDENTITIES="$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" 2>/dev/null | awk -F'\"' -v expected="$EXPECTED_DEVELOPER_IDENTITY" '$2 == expected { print $2 }')"
          SIGN_IDENTITY_COUNT="$(printf '%s\n' "$SIGN_IDENTITIES" | awk 'NF { count++ } END { print count + 0 }')"
          if [[ "$SIGN_IDENTITY_COUNT" != "1" ]]; then
            echo "Expected exactly one OpenClaw Foundation Developer ID identity; found ${SIGN_IDENTITY_COUNT}." >&2
            exit 1
          fi
          SIGN_IDENTITY="$SIGN_IDENTITIES"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - &notary_keys
        name: Write notary and Sparkle key files
        if: ${{ steps.packaging.outputs.complete == 'true' && !inputs.smoke_test_only }}
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          NOTARYTOOL_KEY_PATH="$RUNNER_TEMP/openclaw-notary.p8"
          SPARKLE_PRIVATE_KEY_PATH="$RUNNER_TEMP/openclaw-sparkle-ed25519.pem"
          export NOTARYTOOL_KEY_PATH SPARKLE_PRIVATE_KEY_PATH
          python3 - <<'PY'
          import os
          from pathlib import Path

          def write_secret(path_env: str, value_env: str) -> None:
              value = os.environ[value_env].replace("\\n", "\n")
              Path(os.environ[path_env]).write_text(value, encoding="utf-8")

          write_secret("NOTARYTOOL_KEY_PATH", "APP_STORE_CONNECT_API_KEY_P8")
          write_secret("SPARKLE_PRIVATE_KEY_PATH", "SPARKLE_PRIVATE_KEY")
          PY
          echo "NOTARYTOOL_KEY=$NOTARYTOOL_KEY_PATH" >> "$GITHUB_ENV"
          echo "NOTARYTOOL_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARYTOOL_ISSUER=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_FILE=$SPARKLE_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package macOS release
        id: package_release
        if: ${{ !inputs.smoke_test_only }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          BUNDLE_ID: ai.openclaw.mac
          BUILD_ARCHS: ${{ matrix.build_archs }}
          BUILD_CONFIG: release
          SIGN_IDENTITY: ${{ env.SIGN_IDENTITY }}
          SKIP_PNPM_INSTALL: "1"
          SKIP_TSC: "1"
          SKIP_UI_BUILD: "1"
          SPARKLE_FEED_URL: ${{ matrix.feed_url }}
          CHECKPOINT_ONLY: ${{ steps.packaging.outputs.checkpoint_only }}
        run: |
          set -euo pipefail
          if [[ "$CHECKPOINT_ONLY" == true ]]; then
            scripts/package-mac-dist.sh --checkpoint-only
          else
            scripts/package-mac-dist.sh
          fi

      - name: Preserve notarization recovery checkpoint
        id: recovery_checkpoint
        if: ${{ always() && (contains(fromJSON('["success", "failure", "cancelled"]'), steps.package_release.outcome) || (steps.packaging.outputs.checkpoint_only == 'true' && steps.package_smoke.outcome == 'success')) && hashFiles('source/dist/macos-notarization-recovery/manifest.json') != '' }}
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
        run: |
          set -euo pipefail
          checkpoint=dist/macos-notarization-recovery
          python3 scripts/lib/mac-notarization-recovery.py verify "$checkpoint" \
            "$(git rev-parse HEAD)" "$(node -p "require('./package.json').version")" >/dev/null
          if [[ ! -f "$checkpoint/sparkle-tools.zip" ]]; then
            tool=""
            # Prefer the producer host's artifact, matching make_appcast.sh.
            # Follow SwiftPM's build/cache links when collecting the full tool bundle.
            for build_root in "apps/macos/.build/$(uname -m)" apps/macos/.build; do
              if [[ -d "$build_root" ]]; then
                tool="$(find -L "$build_root" -type f -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' -print -quit)"
                [[ -z "$tool" ]] || break
              fi
            done
            [[ -n "$tool" ]] || { echo "Missing producer Sparkle tools for recovery." >&2; exit 1; }
            ditto -c -k --sequesterRsrc --keepParent "$(dirname "$(dirname "$tool")")" "$checkpoint/sparkle-tools.zip"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const data = { releaseTag: process.env.RELEASE_TAG,
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            producerRunId: Number(process.env.GITHUB_RUN_ID), producerRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            producerWorkflowSha: process.env.GITHUB_SHA, preflightOnly: true, smokeTestOnly: process.env.SMOKE_TEST_ONLY === 'true' };
          fs.writeFileSync('dist/macos-notarization-recovery/workflow-release.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE
          python3 scripts/lib/mac-notarization-recovery.py seal "$checkpoint"

      - &upload_checkpoint
        name: Upload notarization recovery checkpoint
        if: ${{ always() && steps.recovery_checkpoint.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'macos-signed' || 'macos-notarization' }}-${{ inputs.tag }}${{ matrix.artifact_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/dist/macos-notarization-recovery
          if-no-files-found: error
          retention-days: 30

      - &write_resume_index
        name: Write resume index
        if: ${{ always() && steps.recovery_checkpoint.outcome == 'success' && !inputs.smoke_test_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
          SOURCE_SHA: ${{ steps.packaging.outputs.source_sha }}
          CHECKPOINT_ARTIFACT: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'macos-signed' || 'macos-notarization' }}-${{ inputs.tag }}${{ matrix.artifact_suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_PREFIX: ${{ steps.packaging.outputs.checkpoint_only == 'true' && 'macos-signed' || 'macos-notarization' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          const data = { schemaVersion: 1, releaseTag: e.RELEASE_TAG, variant: e.ARTIFACT_VARIANT,
            sourceSha: e.SOURCE_SHA, checkpointArtifact: e.CHECKPOINT_ARTIFACT, artifactPrefix: e.ARTIFACT_PREFIX,
            producerRunId: Number(e.GITHUB_RUN_ID), producerRunAttempt: Number(e.GITHUB_RUN_ATTEMPT),
            producerWorkflowSha: e.GITHUB_SHA };
          fs.mkdirSync(`${e.RUNNER_TEMP}/macos-resume`, { recursive: true });
          fs.writeFileSync(`${e.RUNNER_TEMP}/macos-resume/resume.json`, `${JSON.stringify(data)}\n`);
          NODE

      - &upload_resume_index
        name: Upload resume index
        if: ${{ always() && steps.recovery_checkpoint.outcome == 'success' && !inputs.smoke_test_only }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-resume-${{ inputs.tag }}-${{ matrix.variant }}-${{ steps.packaging.outputs.source_sha }}
          path: ${{ runner.temp }}/macos-resume/resume.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - &package_output_0
        name: Name architecture-specific artifacts
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          set -euo pipefail
          [[ -n "$ARTIFACT_SUFFIX" ]] || exit 0
          for extension in zip dmg dSYM.zip; do
            source="dist/OpenClaw-${APP_VERSION}.${extension}"
            destination="dist/OpenClaw-${APP_VERSION}${ARTIFACT_SUFFIX}.${extension}"
            [[ -f "$source" ]] || { echo "Missing packaged output: $source" >&2; exit 1; }
            mv "$source" "$destination"
          done

      - &package_output_1
        name: Verify packaged OpenClaw signing identity
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only) }}
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}
          EXPECTED_ARCHS: ${{ matrix.build_archs }}
          EXPECTED_BUNDLE_ID: ai.openclaw.mac
        run: |
          set -euo pipefail
          ZIP_PATH="source/dist/OpenClaw-${APP_VERSION}${ARTIFACT_SUFFIX}.zip"
          DMG_PATH="source/dist/OpenClaw-${APP_VERSION}${ARTIFACT_SUFFIX}.dmg"
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT

          ditto -x -k "$ZIP_PATH" "$VERIFY_ROOT"
          APP_PATH="$VERIFY_ROOT/OpenClaw.app"
          [[ -d "$APP_PATH" ]] || { echo "OpenClaw.app missing from packaged zip." >&2; exit 1; }

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          APP_SIGNATURE="$(/usr/bin/codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          grep -Fqx "Authority=${EXPECTED_DEVELOPER_IDENTITY}" <<<"$APP_SIGNATURE"
          grep -Fqx "TeamIdentifier=${EXPECTED_DEVELOPER_TEAM_ID}" <<<"$APP_SIGNATURE"
          APP_BUNDLE_ID="$(defaults read "$APP_PATH/Contents/Info" CFBundleIdentifier)"
          [[ "$APP_BUNDLE_ID" == "$EXPECTED_BUNDLE_ID" ]] || {
            echo "Unexpected bundle identifier: ${APP_BUNDLE_ID}" >&2
            exit 1
          }
          ACTUAL_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/OpenClaw")"
          CUA_ARCHS="$(lipo -archs "$APP_PATH/Contents/Resources/cua-driver")"
          if [[ "$EXPECTED_ARCHS" == "all" ]]; then
            [[ "$ACTUAL_ARCHS" == *arm64* && "$ACTUAL_ARCHS" == *x86_64* ]] || {
              echo "Universal app is missing an architecture: ${ACTUAL_ARCHS}" >&2
              exit 1
            }
            [[ "$CUA_ARCHS" == *arm64* && "$CUA_ARCHS" == *x86_64* ]] || {
              echo "Universal CUA driver is missing an architecture: ${CUA_ARCHS}" >&2
              exit 1
            }
          else
            [[ "$ACTUAL_ARCHS" == "$EXPECTED_ARCHS" ]] || {
              echo "Thin app architecture mismatch: expected ${EXPECTED_ARCHS}, got ${ACTUAL_ARCHS}" >&2
              exit 1
            }
            [[ "$CUA_ARCHS" == "$EXPECTED_ARCHS" ]] || {
              echo "Thin CUA architecture mismatch: expected ${EXPECTED_ARCHS}, got ${CUA_ARCHS}" >&2
              exit 1
            }
          fi
          spctl -a -vv -t exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          /usr/bin/codesign --verify --strict --verbose=2 "$DMG_PATH"
          DMG_SIGNATURE="$(/usr/bin/codesign -dv --verbose=4 "$DMG_PATH" 2>&1)"
          grep -Fqx "Authority=${EXPECTED_DEVELOPER_IDENTITY}" <<<"$DMG_SIGNATURE"
          grep -Fqx "TeamIdentifier=${EXPECTED_DEVELOPER_TEAM_ID}" <<<"$DMG_SIGNATURE"
          spctl -a -vv -t open --context context:primary-signature "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - &package_output_2
        name: Seed appcast from public main
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        run: |
          set -euo pipefail
          if curl -fsSL "${{ matrix.feed_url }}" -o source/appcast.xml; then
            echo "Seeded appcast from ${{ matrix.feed_url }}."
          else
            rm -f source/appcast.xml
            echo "No existing appcast at ${{ matrix.feed_url }}; generating a fresh feed."
          fi

      - &package_output_3
        name: Generate signed appcast artifact
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        working-directory: source
        env:
          SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/openclaw/openclaw/releases/download/${{ inputs.tag }}/
          SPARKLE_RELEASE_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          scripts/make_appcast.sh \
            "dist/OpenClaw-${{ steps.package_version.outputs.value }}${{ matrix.artifact_suffix }}.zip" \
            "${{ matrix.feed_url }}"
          if [[ "${{ matrix.appcast_name }}" != appcast.xml ]]; then
            mv appcast.xml "${{ matrix.appcast_name }}"
          fi

      - &package_output_4
        name: Resolve packaged artifact name
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: packaged_artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
        run: |
          set -euo pipefail
          if [[ "$SMOKE_TEST_ONLY" == "true" ]]; then
            echo "value=macos-smoke-${RELEASE_TAG}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=macos-preflight-${RELEASE_TAG}-${{ matrix.variant }}" >> "$GITHUB_OUTPUT"
          fi

      - &package_output_5
        name: Resolve packaged file paths
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: packaged_files
        run: |
          set -euo pipefail
          VERSION="${{ steps.package_version.outputs.value }}"
          SUFFIX="${{ matrix.artifact_suffix }}"
          ZIP_PATH="source/dist/OpenClaw-${VERSION}${SUFFIX}.zip"
          DMG_PATH="source/dist/OpenClaw-${VERSION}${SUFFIX}.dmg"
          DSYM_PATH="source/dist/OpenClaw-${VERSION}${SUFFIX}.dSYM.zip"
          for path in "$ZIP_PATH" "$DMG_PATH" "$DSYM_PATH"; do
            [[ -f "$path" ]] || { echo "Missing packaged output: $path" >&2; exit 1; }
          done
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dsym=$DSYM_PATH" >> "$GITHUB_OUTPUT"

      - &package_output_6
        name: Resolve appcast path
        id: appcast_path
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ZIP_PATH: ${{ steps.packaged_files.outputs.zip }}
          APPCAST_NAME: ${{ matrix.appcast_name }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          APPCAST_PATH="source/${APPCAST_NAME}"
          if [[ -z "$APPCAST_PATH" || ! -f "$APPCAST_PATH" ]]; then
            echo "Stable appcast artifact not found." >&2
            exit 1
          fi
          python3 release-tools/scripts/verify-macos-appcast.py "$APPCAST_PATH" "$ZIP_PATH" \
            "$RELEASE_TAG" "$OPENCLAW_REPOSITORY" "$ARTIFACT_VARIANT"
          echo "path=$APPCAST_PATH" >> "$GITHUB_OUTPUT"

      - &package_output_7
        name: Resolve packaged version
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: packaged_version
        run: |
          set -euo pipefail
          VERSION="${{ steps.package_version.outputs.value }}"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve packaged version from zip filename." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - &package_output_8
        name: Upload stable appcast artifact
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta != 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-appcast-${{ inputs.tag }}-${{ matrix.variant }}
          path: ${{ steps.appcast_path.outputs.path }}
          overwrite: true
          if-no-files-found: error

      - &package_output_9
        name: Skip signed appcast for smoke tests
        if: ${{ steps.packaging.outputs.complete == 'true' && (inputs.smoke_test_only) }}
        run: echo "Smoke-test mode enabled; skip shared production appcast artifact generation."

      - &package_output_10
        name: Skip shared appcast for beta releases
        if: ${{ steps.packaging.outputs.complete == 'true' && (!inputs.smoke_test_only && steps.release_channel.outputs.is_beta == 'true') }}
        run: echo "Beta release detected; skip shared production appcast artifact generation."

      - &package_output_11
        name: Capture release provenance
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: release_provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git -C source rev-parse HEAD)"
          # Provenance must sit beside the packaged outputs: upload-artifact roots the
          # artifact at the common ancestor of every path, and the collector expects flat files.
          # It is written AFTER packaging: the packaging step may rebuild the JS bundle, and
          # tsdown cleans dist/ on a cache miss, which deleted these files in run 35969970230.
          ARTIFACT_DIR="source/dist"
          mkdir -p "$ARTIFACT_DIR"
          printf '%s\n' "$RELEASE_TAG" > "$ARTIFACT_DIR/release-tag-${ARTIFACT_VARIANT}.txt"
          printf '%s\n' "$RELEASE_SHA" > "$ARTIFACT_DIR/release-sha-${ARTIFACT_VARIANT}.txt"
          echo "dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - &package_output_12
        name: Upload packaged macOS artifacts
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packaged_artifacts.outputs.value }}
          path: |
            ${{ steps.packaged_files.outputs.zip }}
            ${{ steps.packaged_files.outputs.dmg }}
            ${{ steps.packaged_files.outputs.dsym }}
            ${{ steps.release_provenance.outputs.dir }}/release-tag-${{ matrix.variant }}.txt
            ${{ steps.release_provenance.outputs.dir }}/release-sha-${{ matrix.variant }}.txt
          overwrite: true
          if-no-files-found: error

      - &package_output_13
        name: Summarize follow-up
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
          ARTIFACT_NAME: ${{ steps.packaged_artifacts.outputs.value }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          IS_BETA: ${{ steps.release_channel.outputs.is_beta }}
        run: |
          set -euo pipefail
          {
            echo "## macOS workflow output"
            echo
            echo "- Packaged artifacts: \`${ARTIFACT_NAME}\`"
            echo "- Version: \`${VERSION}\`"
            echo
            if [[ "$SMOKE_TEST_ONLY" == "true" ]]; then
              echo "This was a smoke-test run. Artifacts are ad-hoc signed, not notarized, and not suitable for release readiness."
            else
              echo "This was a preflight run. Inspect the packaged artifacts before any real publish run."
            fi
            echo
            if [[ "$SMOKE_TEST_ONLY" == "true" ]]; then
              echo "Smoke-test mode skips production Sparkle appcast generation."
            elif [[ "$IS_BETA" != "true" ]]; then
              echo "For stable releases, also download \`macos-appcast-${RELEASE_TAG}\` and commit the universal, arm64, and x86_64 appcasts back to \`main\` in \`${OPENCLAW_REPOSITORY}\`."
            else
              echo "Beta release detected; no production Sparkle appcasts are generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - &clean_signing
        name: Clean up signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi

      - name: Export immutable variant handoff
        id: handoff
        env:
          ARTIFACT_VARIANT: ${{ matrix.variant }}
          SOURCE_SHA: ${{ steps.packaging.outputs.source_sha }}
          CHECKPOINT_SUPPORTED: ${{ steps.packaging.outputs.supported }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          const data = { sourceSha: e.SOURCE_SHA, supported: e.CHECKPOINT_SUPPORTED === 'true',
            mode: e.CHECKPOINT_SUPPORTED === 'true' ? 'checkpoint' : 'legacy',
            runId: e.GITHUB_RUN_ID, attempt: e.GITHUB_RUN_ATTEMPT };
          fs.appendFileSync(e.GITHUB_OUTPUT, `${e.ARTIFACT_VARIANT}=${JSON.stringify(data)}\n`);
          NODE

  notarize_and_package:
    needs: [prepare, build_and_sign]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.reuse_preflight != 'true' && (needs.build_and_sign.result == 'success' || needs.build_and_sign.result == 'skipped') }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    # Release authorization covers signing and notarization; mac-release owns
    # the secrets and main-only deployment policy without a second approval.
    environment: ${{ !inputs.smoke_test_only && 'mac-release' || '' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Select immutable variant handoff
        id: packaging
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          CHECKPOINT_SUPPORTED: ${{ needs.prepare.outputs.checkpoint_supported }}
          HANDOFF: ${{ needs.build_and_sign.outputs[matrix.variant] }}
          RESUME_PLAN: ${{ needs.prepare.outputs.resume_plan }}
          ARTIFACT_VARIANT: ${{ matrix.variant }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          const plan = (JSON.parse(e.RESUME_PLAN || '{}'))[e.ARTIFACT_VARIANT];
          const manual = Boolean(plan);
          if (manual && !['macos-notarization', 'macos-signed'].includes(plan.prefix)) {
            throw new Error('Invalid checkpoint artifact prefix');
          }
          const data = manual ? { mode: 'manual', sourceSha: e.EXPECTED_SOURCE_SHA,
            supported: e.CHECKPOINT_SUPPORTED === 'true', runId: plan.runId, attempt: plan.attempt }
            : JSON.parse(e.HANDOFF);
          if (!/^[a-f0-9]{40}$/.test(data.sourceSha) || typeof data.supported !== 'boolean' ||
              !['manual', 'checkpoint', 'legacy'].includes(data.mode) ||
              !/^[1-9][0-9]*$/.test(data.runId) || !/^[1-9][0-9]*$/.test(data.attempt)) {
            throw new Error('Invalid build handoff');
          }
          if (data.sourceSha !== e.EXPECTED_SOURCE_SHA || data.supported !== (e.CHECKPOINT_SUPPORTED === 'true') || (data.mode === 'manual') !== manual ||
              (!manual && (data.runId !== e.GITHUB_RUN_ID || Number(data.attempt) > Number(e.GITHUB_RUN_ATTEMPT))) ||
              (!manual && (data.mode === 'checkpoint') !== data.supported)) {
            throw new Error('Build handoff run, attempt or mode mismatch');
          }
          const resume = data.mode !== 'legacy';
          const outputs = { complete: resume, checkpoint_only: false, manual,
            needs_signing: manual && !data.supported, source_sha: data.sourceSha,
            run_id: data.runId, attempt: data.attempt,
            artifact_prefix: manual ? plan.prefix : 'macos-signed' };
          for (const [key, value] of Object.entries(outputs)) {
            fs.appendFileSync(e.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          if (!resume) console.log('Legacy source: build_and_sign already packaged this variant.');
          NODE

      - name: Checkout release verification tools
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false

      - name: Checkout checkpoint source
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        env:
          SOURCE_SHA: ${{ steps.packaging.outputs.source_sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/openclaw/openclaw.git source
          git -C source fetch origin "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          [[ "$(git -C source rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Setup Node.js
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select release toolchain
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Resolve package version
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: package_version
        working-directory: source
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        id: release_channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify notarization checkpoint producer
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RECOVERY: ${{ steps.packaging.outputs.manual }}
          RESUME_RUN_ID: ${{ steps.packaging.outputs.run_id }}
          RESUME_RUN_ATTEMPT: ${{ steps.packaging.outputs.attempt }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL_RECOVERY" != true ]]; then
            node <<'NODE'
          const fs = require('node:fs');
          const e = process.env;
          fs.writeFileSync(`${e.RUNNER_TEMP}/notarization-producer.json`, JSON.stringify({
            id: Number(e.RESUME_RUN_ID), run_attempt: Number(e.RESUME_RUN_ATTEMPT), head_sha: e.GITHUB_SHA }));
          NODE
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/attempts/${RESUME_RUN_ATTEMPT}" > "$RUNNER_TEMP/notarization-producer.json"
          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/notarization-producer.json`, 'utf8'));
          const expected = {
            id: Number(process.env.RESUME_RUN_ID), run_attempt: Number(process.env.RESUME_RUN_ATTEMPT),
            path: '.github/workflows/openclaw-macos-publish.yml', head_branch: 'main',
            event: 'workflow_dispatch', status: 'completed',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (run[key] !== value) throw new Error(`Recovery producer ${key} must equal ${value}`);
          }
          if (run.repository?.full_name !== process.env.GITHUB_REPOSITORY ||
              !['failure', 'cancelled'].includes(run.conclusion) || !/^[a-f0-9]{40}$/.test(run.head_sha)) {
            throw new Error('Recovery requires a failed or cancelled signed preflight in this repository');
          }
          NODE

      - name: Download notarization checkpoint
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.packaging.outputs.artifact_prefix }}-${{ inputs.tag }}${{ matrix.artifact_suffix }}-${{ steps.packaging.outputs.run_id }}-${{ steps.packaging.outputs.attempt }}
          path: source/dist/macos-notarization-recovery
          repository: ${{ github.repository }}
          run-id: ${{ steps.packaging.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify notarization checkpoint release binding
        id: recovery_verified
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        env:
          PRETAG_SOURCE_SHA: ${{ inputs.pretag_source_sha }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
          MANUAL_RECOVERY: ${{ steps.packaging.outputs.manual }}
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
          EXPECTED_FEED_URL: ${{ matrix.feed_url }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/lib/mac-notarization-recovery.py ]] || ! grep -Fq -- '--resume-notarization' scripts/package-mac-dist.sh; then
            echo "Selected source does not support notarization recovery. Refusing to rebuild; use source containing the recovery interface." >&2
            exit 1
          fi
          if [[ "$PUBLIC_RELEASE_BRANCH" != main && ! "$PUBLIC_RELEASE_BRANCH" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
            echo "Invalid public release branch." >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          if [[ -n "$PRETAG_SOURCE_SHA" ]]; then
            [[ "$(git rev-parse HEAD)" == "$PRETAG_SOURCE_SHA" ]]
            if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "$PRETAG_SOURCE_SHA" ]]
            fi
          else
            git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" HEAD
          fi
          git merge-base --is-ancestor HEAD "refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const root = 'dist/macos-notarization-recovery';
          const envelope = JSON.parse(fs.readFileSync(`${root}/workflow-release.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`, 'utf8'));
          const producer = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/notarization-producer.json`, 'utf8'));
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const expected = { releaseTag: process.env.RELEASE_TAG, sourceSha, producerRunId: producer.id,
            producerRunAttempt: producer.run_attempt, producerWorkflowSha: producer.head_sha,
            preflightOnly: true, smokeTestOnly: process.env.SMOKE_TEST_ONLY === 'true' };
          for (const [key, value] of Object.entries(expected)) {
            if (envelope[key] !== value) throw new Error(`Recovery checkpoint ${key} mismatch`);
          }
          if (manifest.schemaVersion !== 1 || manifest.sourceSha !== sourceSha || manifest.version !== version ||
              manifest.skipDmg !== false || manifest.skipDsym !== false) {
            throw new Error('Recovery checkpoint source, version or release packaging flags mismatch');
          }
          NODE
          python3 scripts/lib/mac-notarization-recovery.py verify dist/macos-notarization-recovery \
            "$(git rev-parse HEAD)" "$(node -p "require('./package.json').version")" >/dev/null
          if [[ "$MANUAL_RECOVERY" != true ]]; then
            [[ -f dist/macos-notarization-recovery/app.dmg ]] || { echo "Build checkpoint lacks signed DMG." >&2; exit 1; }
          fi
          # Existing checkpoints have no variant field. Bind the matrix to the
          # feed already protected by the signed app and checkpoint hash.
          python3 <<'PY'
          import os, plistlib, zipfile
          with zipfile.ZipFile('dist/macos-notarization-recovery/app.zip') as archive:
              name = 'OpenClaw.app/Contents/Info.plist'
              if archive.namelist().count(name) != 1:
                  raise ValueError('Recovery checkpoint must contain one app Info.plist')
              info = plistlib.loads(archive.read(name))
              if info.get('SUFeedURL') != os.environ['EXPECTED_FEED_URL']:
                  raise ValueError('Recovery checkpoint app feed does not match the selected variant')
          PY

      - *import_signing

      - *signing_identity

      - *notary_keys

      - name: Resume notarization and package macOS artifacts
        id: package_release
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        env:
          APP_VERSION: ${{ steps.package_version.outputs.value }}
          BUNDLE_ID: ai.openclaw.mac
          BUILD_ARCHS: ${{ matrix.build_archs }}
          BUILD_CONFIG: release
          SPARKLE_FEED_URL: ${{ matrix.feed_url }}
          ALLOW_ADHOC_SIGNING: ${{ inputs.smoke_test_only && '1' || '0' }}
          SKIP_NOTARIZE: ${{ inputs.smoke_test_only && '1' || '0' }}
        run: |
          set -euo pipefail
          scripts/package-mac-dist.sh --resume-notarization

      - name: Preserve notarization recovery checkpoint
        id: recovery_checkpoint
        if: ${{ always() && steps.recovery_verified.outcome == 'success' && steps.package_release.outcome != 'skipped' && hashFiles('source/dist/macos-notarization-recovery/manifest.json') != '' }}
        working-directory: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST_ONLY: ${{ inputs.smoke_test_only }}
        run: |
          set -euo pipefail
          checkpoint=dist/macos-notarization-recovery
          python3 scripts/lib/mac-notarization-recovery.py verify "$checkpoint" \
            "$(git rev-parse HEAD)" "$(node -p "require('./package.json').version")" >/dev/null
          if [[ ! -f "$checkpoint/sparkle-tools.zip" ]]; then
            tool=""
            # Prefer the producer host's artifact, matching make_appcast.sh.
            # Follow SwiftPM's build/cache links when collecting the full tool bundle.
            for build_root in "apps/macos/.build/$(uname -m)" apps/macos/.build; do
              if [[ -d "$build_root" ]]; then
                tool="$(find -L "$build_root" -type f -path '*/artifacts/sparkle/Sparkle/bin/generate_appcast' -print -quit)"
                [[ -z "$tool" ]] || break
              fi
            done
            [[ -n "$tool" ]] || { echo "Missing producer Sparkle tools for recovery." >&2; exit 1; }
            ditto -c -k --sequesterRsrc --keepParent "$(dirname "$(dirname "$tool")")" "$checkpoint/sparkle-tools.zip"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const data = { releaseTag: process.env.RELEASE_TAG,
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            producerRunId: Number(process.env.GITHUB_RUN_ID), producerRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            producerWorkflowSha: process.env.GITHUB_SHA, preflightOnly: true, smokeTestOnly: process.env.SMOKE_TEST_ONLY === 'true' };
          fs.writeFileSync('dist/macos-notarization-recovery/workflow-release.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE
          python3 scripts/lib/mac-notarization-recovery.py seal "$checkpoint"

      - *upload_checkpoint
      - *write_resume_index
      - *upload_resume_index

      - name: Restore checkpointed Sparkle tools
        if: ${{ steps.packaging.outputs.complete == 'true' }}
        working-directory: source
        run: |
          set -euo pipefail
          python3 <<'PY'
          import posixpath, stat, zipfile
          with zipfile.ZipFile('dist/macos-notarization-recovery/sparkle-tools.zip') as archive:
              for member in archive.infolist():
                  name = member.filename
                  if name.startswith('/') or '..' in name.split('/') or not name.startswith(('Sparkle/', '__MACOSX/')):
                      raise ValueError('Unexpected Sparkle archive path')
                  if stat.S_ISLNK(member.external_attr >> 16):
                      target = archive.read(member).decode()
                      resolved = posixpath.normpath(posixpath.join(posixpath.dirname(name), target))
                      if target.startswith('/') or not resolved.startswith('Sparkle/'):
                          raise ValueError('Sparkle archive symlink escapes root')
          PY
          ditto -x -k dist/macos-notarization-recovery/sparkle-tools.zip "$RUNNER_TEMP/recovery-sparkle"
          tool="$RUNNER_TEMP/recovery-sparkle/Sparkle/bin/generate_appcast"
          [[ -x "$tool" ]] || { echo "Recovered Sparkle generator is missing." >&2; exit 1; }
          echo "SPARKLE_GENERATE_APPCAST=$tool" >> "$GITHUB_ENV"

      - *package_output_0

      - *package_output_1

      - *package_output_2

      - *package_output_3

      - *package_output_4

      - *package_output_5

      - *package_output_6

      - *package_output_7

      - *package_output_8

      - *package_output_9

      - *package_output_10

      - *package_output_11

      - *package_output_12

      - *package_output_13

      - *clean_signing

  collect_preflight_artifacts:
    needs: [prepare, build_and_sign, notarize_and_package]
    if: ${{ !cancelled() && needs.prepare.outputs.reuse_preflight != 'true' && needs.notarize_and_package.result == 'success' && (needs.build_and_sign.result == 'success' || needs.build_and_sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download signed preflight variants
        if: ${{ !inputs.smoke_test_only }}
        uses: actions/download-artifact@v8
        with:
          pattern: macos-preflight-${{ inputs.tag }}-*
          path: collected-artifacts
          merge-multiple: true

      - name: Download smoke-test variants
        if: ${{ inputs.smoke_test_only }}
        uses: actions/download-artifact@v8
        with:
          pattern: macos-smoke-${{ inputs.tag }}-*
          path: collected-artifacts
          merge-multiple: true

      - name: Verify complete macOS artifact set
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for suffix in "" -arm64 -x86_64; do
            for extension in zip dmg dSYM.zip; do
              path="collected-artifacts/OpenClaw-${version}${suffix}.${extension}"
              [[ -f "$path" ]] || { echo "Missing macOS artifact variant: $path" >&2; exit 1; }
            done
          done
          release_sha=""
          for variant in universal arm64 x86_64; do
            tag_file="collected-artifacts/release-tag-${variant}.txt"
            sha_file="collected-artifacts/release-sha-${variant}.txt"
            [[ "$(tr -d '\r\n' < "$tag_file")" == "$RELEASE_TAG" ]] || {
              echo "macOS ${variant} artifact tag mismatch." >&2
              exit 1
            }
            variant_sha="$(tr -d '\r\n' < "$sha_file")"
            [[ "$variant_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "macOS ${variant} artifact SHA is invalid." >&2
              exit 1
            }
            if [[ -n "$release_sha" && "$variant_sha" != "$release_sha" ]]; then
              echo "macOS artifact variants were built from different source commits." >&2
              exit 1
            fi
            release_sha="$variant_sha"
          done
          cp collected-artifacts/release-tag-universal.txt collected-artifacts/release-tag.txt
          cp collected-artifacts/release-sha-universal.txt collected-artifacts/release-sha.txt

      - name: Upload complete macOS preflight artifact
        if: ${{ !inputs.smoke_test_only }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-preflight-${{ inputs.tag }}
          path: collected-artifacts
          overwrite: true
          if-no-files-found: error

      - name: Upload complete macOS smoke artifact
        if: ${{ inputs.smoke_test_only }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-smoke-${{ inputs.tag }}
          path: collected-artifacts
          overwrite: true
          if-no-files-found: error

      - name: Download architecture-specific appcasts
        if: ${{ !inputs.smoke_test_only && !contains(inputs.tag, '-beta.') }}
        uses: actions/download-artifact@v8
        with:
          pattern: macos-appcast-${{ inputs.tag }}-*
          path: collected-appcasts
          merge-multiple: true

      - name: Verify complete appcast set
        if: ${{ !inputs.smoke_test_only && !contains(inputs.tag, '-beta.') }}
        run: |
          set -euo pipefail
          for name in appcast.xml appcast-arm64.xml appcast-x86_64.xml; do
            [[ -f "collected-appcasts/$name" ]] || { echo "Missing macOS appcast: $name" >&2; exit 1; }
          done

      - name: Upload complete appcast artifact
        if: ${{ !inputs.smoke_test_only && !contains(inputs.tag, '-beta.') }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-appcast-${{ inputs.tag }}
          path: collected-appcasts
          overwrite: true
          if-no-files-found: error

  promote_release_artifacts:
    needs: prepare
    if: ${{ !inputs.preflight_only && !inputs.smoke_test_only }}
    runs-on: ubuntu-latest
    # Final promotion is independently environment-gated, just like npm publish.
    environment: mac-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release verification tools
        uses: actions/checkout@v7
        with:
          path: release-tools
          persist-credentials: false

      - name: Ensure matching GitHub release exists (draft or public)
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN secret." >&2
            exit 1
          fi
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$OPENCLAW_REPOSITORY" --json tagName,isDraft,url)"
          printf '%s' "$RELEASE_JSON" | node -e 'const fs = require("node:fs"); const release = JSON.parse(fs.readFileSync(0, "utf8")); if (release.tagName !== process.env.RELEASE_TAG) throw new Error("GitHub release tag does not match requested tag"); console.log(`Attaching to ${release.isDraft ? "draft" : "public"} release ${release.url}; the npm publisher flips it public.`);'

      - name: Determine release channel
        id: release_channel
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify preflight run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run view "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,event,conclusion,url)"
          printf '%s' "$RUN_JSON" | node -e 'const fs = require("node:fs"); const run = JSON.parse(fs.readFileSync(0, "utf8")); const checks = [["workflowName", "OpenClaw macOS Publish"], ["headBranch", "main"], ["event", "workflow_dispatch"], ["conclusion", "success"]]; for (const [key, expected] of checks) { if (run[key] !== expected) { console.error(`Referenced mac preflight run ${process.env.PREFLIGHT_RUN_ID} must have ${key}=${expected}, got ${run[key] ?? "<missing>"}.`); process.exit(1); } } console.log(`Using mac preflight run ${process.env.PREFLIGHT_RUN_ID}: ${run.url}`);'

      - name: Verify validate run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RUN_ID: ${{ inputs.validate_run_id }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh run view "$VALIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,event,conclusion,url)"
          printf '%s' "$RUN_JSON" | node -e 'const fs = require("node:fs"); const run = JSON.parse(fs.readFileSync(0, "utf8")); const checks = [["workflowName", "OpenClaw macOS Validate"], ["headBranch", "main"], ["event", "workflow_dispatch"], ["conclusion", "success"]]; for (const [key, expected] of checks) { if (run[key] !== expected) { console.error(`Referenced mac validation run ${process.env.VALIDATE_RUN_ID} must have ${key}=${expected}, got ${run[key] ?? "<missing>"}.`); process.exit(1); } } console.log(`Using mac validation run ${process.env.VALIDATE_RUN_ID}: ${run.url}`);'

      - name: Resolve expected public release commit
        id: expected_release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED_RELEASE_SHA=""
          while IFS=$'\t' read -r oid ref; do
            if [[ "$ref" == "refs/tags/${RELEASE_TAG}^{}" ]]; then
              EXPECTED_RELEASE_SHA="$oid"
              break
            fi
            if [[ "$ref" == "refs/tags/${RELEASE_TAG}" ]]; then
              EXPECTED_RELEASE_SHA="$oid"
            fi
          done < <(git ls-remote https://github.com/openclaw/openclaw.git "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          if [[ -z "$EXPECTED_RELEASE_SHA" ]]; then
            echo "Unable to resolve public tag commit for ${RELEASE_TAG}." >&2
            exit 1
          fi
          echo "sha=$EXPECTED_RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download prepared macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-preflight-${{ inputs.tag }}
          path: promoted-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}

      - name: Verify prepared macOS artifact provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ steps.expected_release.outputs.sha }}
          PUBLIC_RELEASE_BRANCH: ${{ inputs.public_release_branch }}
        run: |
          set -euo pipefail
          TAG_FILE="$(find promoted-artifacts -type f -name 'release-tag.txt' -print | sort | tail -n 1)"
          SHA_FILE="$(find promoted-artifacts -type f -name 'release-sha.txt' -print | sort | tail -n 1)"
          if [[ -z "$TAG_FILE" || -z "$SHA_FILE" || ! -f "$TAG_FILE" || ! -f "$SHA_FILE" ]]; then
            echo "Prepared macOS preflight metadata is missing." >&2
            ls -la promoted-artifacts >&2 || true
            exit 1
          fi
          ARTIFACT_RELEASE_TAG="$(tr -d '\r\n' < "$TAG_FILE")"
          ARTIFACT_RELEASE_SHA="$(tr -d '\r\n' < "$SHA_FILE")"
          if [[ "$ARTIFACT_RELEASE_TAG" != "$RELEASE_TAG" ]]; then
            echo "Prepared macOS preflight tag mismatch: expected $RELEASE_TAG, got $ARTIFACT_RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$ARTIFACT_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            if [[ "${PUBLIC_RELEASE_BRANCH}" != "main" && ! "${PUBLIC_RELEASE_BRANCH}" =~ ^release/[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*$ ]]; then
              echo "Invalid public_release_branch: ${PUBLIC_RELEASE_BRANCH}" >&2
              exit 1
            fi
            git init public-source
            git -C public-source remote add origin https://github.com/openclaw/openclaw.git
            git -C public-source fetch --filter=blob:none --depth=200 origin \
              "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
              "+refs/heads/${PUBLIC_RELEASE_BRANCH}:refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"
            RESOLVED_TAG_SHA="$(git -C public-source rev-parse "refs/tags/${RELEASE_TAG}^{}")"
            if [[ "$RESOLVED_TAG_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
              echo "Resolved tag SHA changed while verifying artifacts: expected $EXPECTED_RELEASE_SHA, got $RESOLVED_TAG_SHA" >&2
              exit 1
            fi
            if ! git -C public-source merge-base --is-ancestor "$EXPECTED_RELEASE_SHA" "$ARTIFACT_RELEASE_SHA"; then
              echo "Prepared macOS preflight SHA $ARTIFACT_RELEASE_SHA is not a descendant of release tag $RELEASE_TAG ($EXPECTED_RELEASE_SHA)." >&2
              exit 1
            fi
            if ! git -C public-source merge-base --is-ancestor "$ARTIFACT_RELEASE_SHA" "refs/remotes/origin/${PUBLIC_RELEASE_BRANCH}"; then
              echo "Prepared macOS preflight SHA $ARTIFACT_RELEASE_SHA is not contained in ${PUBLIC_RELEASE_BRANCH}." >&2
              exit 1
            fi
          fi

      - name: Download prepared stable appcast artifact
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: macos-appcast-${{ inputs.tag }}
          path: promoted-appcast
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}

      - name: Download validation proof artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-validate-${{ inputs.tag }}
          path: promoted-validation
          repository: ${{ github.repository }}
          run-id: ${{ inputs.validate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify validation artifact provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ steps.expected_release.outputs.sha }}
        run: |
          set -euo pipefail
          PREFLIGHT_SHA_FILE="$(find promoted-artifacts -type f -name 'release-sha.txt' -print | sort | tail -n 1)"
          TAG_FILE="$(find promoted-validation -type f -name 'release-tag.txt' -print | sort | tail -n 1)"
          SHA_FILE="$(find promoted-validation -type f -name 'release-sha.txt' -print | sort | tail -n 1)"
          if [[ -z "$PREFLIGHT_SHA_FILE" || -z "$TAG_FILE" || -z "$SHA_FILE" || ! -f "$PREFLIGHT_SHA_FILE" || ! -f "$TAG_FILE" || ! -f "$SHA_FILE" ]]; then
            echo "Validation proof metadata is missing." >&2
            ls -la promoted-validation >&2 || true
            exit 1
          fi
          PREFLIGHT_RELEASE_SHA="$(tr -d '\r\n' < "$PREFLIGHT_SHA_FILE")"
          VALIDATION_RELEASE_TAG="$(tr -d '\r\n' < "$TAG_FILE")"
          VALIDATION_RELEASE_SHA="$(tr -d '\r\n' < "$SHA_FILE")"
          if [[ "$VALIDATION_RELEASE_TAG" != "$RELEASE_TAG" ]]; then
            echo "Validation proof tag mismatch: expected $RELEASE_TAG, got $VALIDATION_RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$VALIDATION_RELEASE_SHA" != "$PREFLIGHT_RELEASE_SHA" ]]; then
            echo "Validation proof SHA mismatch: expected preflight source $PREFLIGHT_RELEASE_SHA, got $VALIDATION_RELEASE_SHA" >&2
            exit 1
          fi

      - name: Resolve packaged artifact name
        id: packaged_artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "value=macos-release-${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve packaged file paths
        id: packaged_files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SEARCH_DIR="promoted-artifacts"
          VERSION="${RELEASE_TAG#v}"
          for variant in universal arm64 x86_64; do
            suffix=""
            [[ "$variant" == universal ]] || suffix="-$variant"
            for kind in zip dmg dsym; do
              extension="$kind"
              [[ "$kind" == dsym ]] && extension="dSYM.zip"
              path="$SEARCH_DIR/OpenClaw-${VERSION}${suffix}.${extension}"
              [[ -f "$path" ]] || { echo "Missing packaged output: $path" >&2; exit 1; }
              echo "${variant}_${kind}=$path" >> "$GITHUB_OUTPUT"
            done
          done

      - name: Resolve appcast path
        id: appcast_path
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UNIVERSAL_ZIP: ${{ steps.packaged_files.outputs.universal_zip }}
          ARM64_ZIP: ${{ steps.packaged_files.outputs.arm64_zip }}
          X86_64_ZIP: ${{ steps.packaged_files.outputs.x86_64_zip }}
        run: |
          set -euo pipefail
          for variant in universal arm64 x86_64; do
            case "$variant" in
              universal) name=appcast.xml; zip="$UNIVERSAL_ZIP" ;;
              arm64) name=appcast-arm64.xml; zip="$ARM64_ZIP" ;;
              x86_64) name=appcast-x86_64.xml; zip="$X86_64_ZIP" ;;
            esac
            path="promoted-appcast/$name"
            [[ -f "$path" ]] || { echo "Stable appcast artifact not found: $name" >&2; exit 1; }
            python3 release-tools/scripts/verify-macos-appcast.py "$path" "$zip" \
              "$RELEASE_TAG" "$OPENCLAW_REPOSITORY" "$variant"
            echo "${variant}=$path" >> "$GITHUB_OUTPUT"
          done

      - name: Resolve packaged version
        id: packaged_version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve packaged version from zip filename." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload stable appcast artifact
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-appcast-${{ inputs.tag }}
          path: |
            ${{ steps.appcast_path.outputs.universal }}
            ${{ steps.appcast_path.outputs.arm64 }}
            ${{ steps.appcast_path.outputs.x86_64 }}
          if-no-files-found: error

      - name: Skip shared appcast for beta releases
        if: ${{ steps.release_channel.outputs.is_beta == 'true' }}
        run: echo "Beta release detected; skip shared production appcast artifact generation."

      - name: Upload packaged macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.packaged_artifacts.outputs.value }}
          path: |
            ${{ steps.packaged_files.outputs.universal_zip }}
            ${{ steps.packaged_files.outputs.universal_dmg }}
            ${{ steps.packaged_files.outputs.universal_dsym }}
            ${{ steps.packaged_files.outputs.arm64_zip }}
            ${{ steps.packaged_files.outputs.arm64_dmg }}
            ${{ steps.packaged_files.outputs.arm64_dsym }}
            ${{ steps.packaged_files.outputs.x86_64_zip }}
            ${{ steps.packaged_files.outputs.x86_64_dmg }}
            ${{ steps.packaged_files.outputs.x86_64_dsym }}
          if-no-files-found: error

      - name: Upload packaged macOS assets to public GitHub release
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN secret." >&2
            exit 1
          fi
          assets=()
          for suffix in "" -arm64 -x86_64; do
            for extension in zip dmg dSYM.zip; do
              assets+=("promoted-artifacts/OpenClaw-${VERSION}${suffix}.${extension}")
            done
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$OPENCLAW_REPOSITORY"

      - name: Verify public GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
        run: |
          set -euo pipefail
          ASSET_NAMES="$(gh release view "$RELEASE_TAG" --repo "$OPENCLAW_REPOSITORY" --json assets --jq '.assets[].name')"
          for suffix in "" -arm64 -x86_64; do
            for extension in zip dmg dSYM.zip; do
              asset_name="OpenClaw-${VERSION}${suffix}.${extension}"
              if ! printf '%s\n' "$ASSET_NAMES" | grep -Fqx "$asset_name"; then
                echo "Expected release asset not found after upload: $asset_name" >&2
                exit 1
              fi
            done
          done

      - name: Publish stable appcast to public main
        if: ${{ steps.release_channel.outputs.is_beta != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
          UNIVERSAL_APPCAST: ${{ steps.appcast_path.outputs.universal }}
          ARM64_APPCAST: ${{ steps.appcast_path.outputs.arm64 }}
          X86_64_APPCAST: ${{ steps.appcast_path.outputs.x86_64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing OPENCLAW_PUBLIC_REPO_RELEASE_TOKEN secret." >&2
            exit 1
          fi
          for path in "$UNIVERSAL_APPCAST" "$ARM64_APPCAST" "$X86_64_APPCAST"; do
            [[ -f "$path" ]] || { echo "Stable appcast path is missing: $path" >&2; exit 1; }
          done
          universal_source="$(realpath "$UNIVERSAL_APPCAST")"
          arm64_source="$(realpath "$ARM64_APPCAST")"
          x86_64_source="$(realpath "$X86_64_APPCAST")"

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OPENCLAW_REPOSITORY}.git" "${workdir}/openclaw"
          cd "${workdir}/openclaw"
          git config user.name "openclaw-release-bot"
          git config user.email "release-bot@openclaw.ai"
          cp "$universal_source" appcast.xml
          cp "$arm64_source" appcast-arm64.xml
          cp "$x86_64_source" appcast-x86_64.xml

          if git diff --quiet -- appcast.xml appcast-arm64.xml appcast-x86_64.xml; then
            echo "Public main already has every macOS appcast for ${RELEASE_TAG}."
            exit 0
          fi

          git add appcast.xml appcast-arm64.xml appcast-x86_64.xml
          git commit -m "chore(release): update appcast for ${VERSION}"
          if git push origin HEAD:main; then
            echo "Published appcast.xml directly to public main for ${RELEASE_TAG}."
            exit 0
          fi

          branch="release/appcast-${RELEASE_TAG#v}"
          git push --force-with-lease origin HEAD:"${branch}"
          pr_url="$(gh pr list --repo "${OPENCLAW_REPOSITORY}" --head "${branch}" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "${pr_url}" ]]; then
            pr_url="$(gh pr create \
              --repo "${OPENCLAW_REPOSITORY}" \
              --head "${branch}" \
              --base main \
              --title "chore(release): update appcast for ${VERSION}" \
              --body "Updates the universal, arm64, and x86_64 Sparkle appcasts generated by macOS publish for ${RELEASE_TAG}.")"
          fi
          echo "Direct main push was blocked; opened appcast PR: ${pr_url}"

      - name: Summarize follow-up
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.packaged_version.outputs.value }}
          ARTIFACT_NAME: ${{ steps.packaged_artifacts.outputs.value }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          IS_BETA: ${{ steps.release_channel.outputs.is_beta }}
        run: |
          set -euo pipefail
          {
            echo "## macOS workflow output"
            echo
            echo "- Packaged artifacts: \`${ARTIFACT_NAME}\`"
            echo "- Version: \`${VERSION}\`"
            echo
            echo "This real publish reused preflight artifacts from run \`${PREFLIGHT_RUN_ID}\`; no rebuild, signing, or notarization work ran in this publish job."
            echo "Assets are attached to the GitHub release, which may still be a draft; the core npm publisher flips it public."
            echo
            if [[ "$IS_BETA" != "true" ]]; then
              echo "Stable appcast publish runs automatically after public release assets are verified. If direct \`main\` push is blocked, the workflow opens or updates an appcast PR."
            else
              echo "Beta release detected; no shared production \`appcast.xml\` artifact is generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
