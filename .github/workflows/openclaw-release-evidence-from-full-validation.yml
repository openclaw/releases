name: OpenClaw Release Evidence From Full Validation

on:
  workflow_dispatch:
    inputs:
      full_validation_run_id:
        description: Public openclaw/openclaw Full Release Validation run id
        required: true
        type: string
      full_validation_run_attempt:
        description: Optional exact Full Release Validation attempt; blank uses the current attempt
        required: false
        default: ""
        type: string
      release_id:
        description: Release evidence directory name, for example 2026.4.27-beta.1
        required: true
        type: string
      release_ref:
        description: Exact public OpenClaw release ref, tag, or SHA
        required: true
        type: string
      package_spec:
        description: Exact package spec covered by this evidence, for example openclaw@2026.4.27-beta.1
        required: true
        type: string
      notes:
        description: Optional release-manager notes to append to the evidence markdown
        required: false
        default: ""
        type: string
  repository_dispatch:
    types:
      - openclaw_full_release_validation_completed

concurrency:
  group: openclaw-release-evidence-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_id || inputs.release_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  FULL_VALIDATION_RUN_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.full_validation_run_id || inputs.full_validation_run_id }}
  FULL_VALIDATION_RUN_ATTEMPT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.full_validation_run_attempt || inputs.full_validation_run_attempt }}
  RELEASE_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_id || inputs.release_id }}
  RELEASE_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_ref || inputs.release_ref }}
  PACKAGE_SPEC: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.package_spec || inputs.package_spec }}
  NOTES: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.notes || inputs.notes }}

jobs:
  write_evidence:
    if: github.ref == 'refs/heads/main'
    environment: release-evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          ref: main
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Write workflow notes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openclaw-release-evidence"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/openclaw-release-evidence/notes.md"

      - name: Generate release evidence
        env:
          GH_TOKEN: ${{ secrets.OPENCLAW_RELEASES_PRIVATE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && ! "$FULL_VALIDATION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::repository_dispatch requires a positive full_validation_run_attempt."
            exit 1
          fi
          attempt_args=()
          if [[ -n "$FULL_VALIDATION_RUN_ATTEMPT" ]]; then
            attempt_args=(--full-validation-run-attempt "$FULL_VALIDATION_RUN_ATTEMPT")
          fi
          node scripts/openclaw-release-evidence-from-full-validation.mjs \
            --full-validation-run-id "$FULL_VALIDATION_RUN_ID" \
            "${attempt_args[@]}" \
            --release-id "$RELEASE_ID" \
            --release-ref "$RELEASE_REF" \
            --package-spec "$PACKAGE_SPEC" \
            --notes-file "$RUNNER_TEMP/openclaw-release-evidence/notes.md"

      - name: Append run summary
        run: |
          set -euo pipefail
          evidence_md="evidence/${RELEASE_ID}/release-evidence.md"
          {
            cat "$evidence_md"
            echo
            echo "Evidence path: \`$evidence_md\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit evidence to main
        run: |
          set -euo pipefail
          evidence_path="evidence/${RELEASE_ID}"
          node scripts/openclaw-release-evidence-contract.mjs verify-evidence \
            "${evidence_path}/release-evidence.json" "$RELEASE_ID" "$RELEASE_REF" "$PACKAGE_SPEC" \
            --require-full-validation
          git config user.name "openclaw-release-bot"
          git config user.email "release-bot@openclaw.ai"
          git add "${evidence_path}"
          generated_tree="$(git write-tree)"
          expected_tree="$(git rev-parse "${generated_tree}:${evidence_path}")"
          changed=0
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
          else
            git commit -m "Evidence: record ${RELEASE_ID}"
            changed=1
          fi

          if [[ "$changed" == "1" ]]; then
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main; then
                if [[ "$(git rev-parse "HEAD:${evidence_path}")" != "$expected_tree" ]]; then
                  echo "::error::Rebase changed the generated evidence directory."
                  exit 1
                fi
                if git push origin HEAD:main; then
                  pushed=1
                  break
                fi
              fi
              git rebase --abort || true
              sleep $((attempt * 5))
            done
            if [[ "$pushed" != "1" ]]; then
              echo "::error::Could not push evidence to main after retries."
              exit 1
            fi
          fi

          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Published evidence commit is not reachable from origin/main."
            exit 1
          }
          remote_tree="$(git rev-parse "origin/main:${evidence_path}")"
          if [[ "$expected_tree" != "$remote_tree" ]]; then
            echo "::error::Remote evidence directory differs from the generated files."
            exit 1
          fi
          remote_json="$RUNNER_TEMP/openclaw-release-evidence/remote-release-evidence.json"
          git show "origin/main:${evidence_path}/release-evidence.json" > "$remote_json"
          cmp "${evidence_path}/release-evidence.json" "$remote_json" || {
            echo "::error::Remote evidence bytes differ from the generated JSON."
            exit 1
          }
          node scripts/openclaw-release-evidence-contract.mjs verify-evidence \
            "$remote_json" "$RELEASE_ID" "$RELEASE_REF" "$PACKAGE_SPEC" \
            --require-full-validation
