name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pnpm: "10.33.0"
          - os: xcode-27
            pnpm: "12.1.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare package-manager fixture
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          mkdir -p .git/action-proof/source
          printf '{"private":true,"packageManager":"pnpm@%s"}\n' "$PNPM_VERSION" > .git/action-proof/source/package.json

      - name: Setup pnpm from source manifest
        uses: pnpm/action-setup@v6
        with:
          package_json_file: .git/action-proof/source/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Check scripts
        run: |
          node --check scripts/openclaw-release-evidence.mjs
          node --check scripts/openclaw-release-evidence-from-full-validation.mjs
          node --check scripts/release-npm-beta-floor.mjs

      - name: Run workflow regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Run script tests
        run: node --test 'tests/*.test.mjs'

      - name: Exercise selected package manager
        working-directory: .git/action-proof/source
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm store path

      - name: Prepare action round-trip proof
        run: |
          mkdir -p "$RUNNER_TEMP/action-proof"
          printf 'release action round-trip proof\n' > "$RUNNER_TEMP/action-proof/proof.txt"

      - name: Save proof cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/action-proof
          key: release-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove local cache input
        run: rm "$RUNNER_TEMP/action-proof/proof.txt"

      - name: Restore proof cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/action-proof
          key: release-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Upload restored proof
        uses: actions/upload-artifact@v7
        with:
          name: action-proof-${{ runner.os }}
          path: ${{ runner.temp }}/action-proof/proof.txt
          if-no-files-found: error
          retention-days: 1

      - name: Download proof
        uses: actions/download-artifact@v8
        with:
          name: action-proof-${{ runner.os }}
          path: ${{ runner.temp }}/action-proof-downloaded

      - name: Verify round-trip content
        run: |
          printf 'release action round-trip proof\n' | diff - "$RUNNER_TEMP/action-proof-downloaded/proof.txt"
          echo "Cache and artifact round trips passed."

  native_diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect compiler and VM
        run: |
          xcodebuild -version
          xcrun --find metal
          xcrun metal --version || true
          df -h
          sysctl hw.memsize hw.ncpu
          system_profiler SPDisplaysDataType
          xcodebuild -showComponent MetalToolchain || true
      - name: Compile pinned Metal kernel before component installation
        id: before
        continue-on-error: true
        run: |
          curl --fail --location --retry 2 https://codeload.github.com/ml-explore/mlx-swift/tar.gz/0bb916c67f4b9e5c682cbe02a42c701c93ab5021 -o "$RUNNER_TEMP/mlx.tar.gz"
          mkdir "$RUNNER_TEMP/mlx"
          tar -xzf "$RUNNER_TEMP/mlx.tar.gz" -C "$RUNNER_TEMP/mlx" --strip-components=1
          cd "$RUNNER_TEMP/mlx"
          xcrun metal -c -target air64-apple-macos14.0 -isysroot "$(xcrun --show-sdk-path)" -fmetal-math-mode=fast -fmetal-math-fp32-functions=fast -serialize-diagnostics "$RUNNER_TEMP/kernel.dia" -o "$RUNNER_TEMP/kernel.air" Source/Cmlx/mlx-generated/metal/steel/attn/kernels/steel_attention.metal
      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Compile pinned Metal kernel after component installation
        run: |
          xcrun metal --version
          cd "$RUNNER_TEMP/mlx"
          xcrun metal -c -target air64-apple-macos14.0 -isysroot "$(xcrun --show-sdk-path)" -fmetal-math-mode=fast -fmetal-math-fp32-functions=fast -serialize-diagnostics "$RUNNER_TEMP/kernel-after.dia" -o "$RUNNER_TEMP/kernel-after.air" Source/Cmlx/mlx-generated/metal/steel/attn/kernels/steel_attention.metal
      - name: Create representative read-only snapshots
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-source"
          git -C "$RUNNER_TEMP/image-source" init
          git -C "$RUNNER_TEMP/image-source" config user.name Fixture
          git -C "$RUNNER_TEMP/image-source" config user.email fixture@example.invalid
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'image-source'
          for i in range(1000):
              (root / f'file-{i}').write_bytes(b'fixture\n' * 128)
          PY
          git -C "$RUNNER_TEMP/image-source" add .
          git -C "$RUNNER_TEMP/image-source" commit -m fixture
          /usr/sbin/diskutil image create from --verbose --format UDRO --volumeName Snapshot "$RUNNER_TEMP/image-source" "$RUNNER_TEMP/arm64.dmg"
          arch -x86_64 /usr/sbin/diskutil image create from --verbose --format UDRO --volumeName Snapshot "$RUNNER_TEMP/image-source" "$RUNNER_TEMP/intel.dmg"
          git clone --quiet --no-checkout --filter=blob:none https://github.com/openclaw/Peekaboo.git "$RUNNER_TEMP/peekaboo"
          git -C "$RUNNER_TEMP/peekaboo" checkout --quiet --detach 7020aedd362038043e4fc1988a8634657270e476
          git -C "$RUNNER_TEMP/peekaboo" submodule update --init --recursive --depth=1
          /usr/sbin/diskutil image create from --verbose --format UDRO --volumeName Snapshot "$RUNNER_TEMP/peekaboo" "$RUNNER_TEMP/peekaboo.dmg"
