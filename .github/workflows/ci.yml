name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nix_source_phase:
        description: "One-off isolated source qualification (no promotion)"
        type: choice
        default: "off"
        options: ["off", "diagnostic", "prefetch", "qualify"]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.nix_source_phase == 'off' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pnpm: "10.33.0"
          - os: macos-26
            pnpm: "12.1.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare package-manager fixture
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          mkdir -p .git/action-proof/source
          printf '{"private":true,"packageManager":"pnpm@%s"}\n' "$PNPM_VERSION" > .git/action-proof/source/package.json

      - name: Setup pnpm from source manifest
        uses: pnpm/action-setup@v6
        with:
          package_json_file: .git/action-proof/source/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Check scripts
        run: |
          node --check scripts/openclaw-release-evidence.mjs
          node --check scripts/openclaw-release-evidence-from-full-validation.mjs
          node --check scripts/release-npm-beta-floor.mjs

      - name: Run workflow regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Run script tests
        run: node --test 'tests/*.test.mjs'

      - name: Exercise selected package manager
        working-directory: .git/action-proof/source
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm store path

      - name: Prepare action round-trip proof
        run: |
          mkdir -p "$RUNNER_TEMP/action-proof"
          printf 'release action round-trip proof\n' > "$RUNNER_TEMP/action-proof/proof.txt"

      - name: Save proof cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/action-proof
          key: release-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove local cache input
        run: rm "$RUNNER_TEMP/action-proof/proof.txt"

      - name: Restore proof cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/action-proof
          key: release-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Upload restored proof
        uses: actions/upload-artifact@v7
        with:
          name: action-proof-${{ runner.os }}
          path: ${{ runner.temp }}/action-proof/proof.txt
          if-no-files-found: error
          retention-days: 1

      - name: Download proof
        uses: actions/download-artifact@v8
        with:
          name: action-proof-${{ runner.os }}
          path: ${{ runner.temp }}/action-proof-downloaded

      - name: Verify round-trip content
        run: |
          printf 'release action round-trip proof\n' | diff - "$RUNNER_TEMP/action-proof-downloaded/proof.txt"
          echo "Cache and artifact round trips passed."

  nix-source-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'openclaw/releases' &&
      (inputs.nix_source_phase == 'diagnostic' || inputs.nix_source_phase == 'prefetch' || inputs.nix_source_phase == 'qualify') &&
      github.ref == 'refs/heads/test/nix-source-qualification-driver-20260910' &&
      github.actor == 'vincentkoc' && github.triggering_actor == 'vincentkoc'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: macos-26
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.nix_source_phase == 'diagnostic' && 10 || 60 }}
    env:
      NIX_QUALIFIER_SYSTEM: ${{ matrix.system }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact public driver without credentials
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            git init .
            git remote add origin https://github.com/openclaw/releases.git
            git -c credential.helper= fetch --depth=1 origin "$GITHUB_SHA"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test -z "$(git status --porcelain)"
          } >"$RUNNER_TEMP/source-driver-checkout.log" 2>&1 || {
            echo "Exact driver checkout failed; no qualification."
            exit 1
          }

      - name: Install isolated native Nix
        run: python3 scripts/nix-source-qualification/driver.py install

      - name: Run approved source-only phase
        env:
          SOURCE_PHASE: ${{ inputs.nix_source_phase }}
        run: python3 scripts/nix-source-qualification/driver.py "$SOURCE_PHASE"
