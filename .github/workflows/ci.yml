name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-publisher:
    name: Store publisher tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise authorization and Microsoft API boundaries
        shell: pwsh
        run: |
          ./tests/test-microsoft-store-authorization.ps1
          ./tests/test-microsoft-store-submission.ps1
          ./tests/test-microsoft-store-flight.ps1
          ./tests/test-microsoft-store-recovery.ps1
          ./tests/test-microsoft-store-workflow.ps1

  validate:
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pnpm: "10.33.0"
          - os: xcode-27
            pnpm: "12.1.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare package-manager fixture
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          mkdir -p .git/action-proof/source
          printf '{"private":true,"packageManager":"pnpm@%s"}\n' "$PNPM_VERSION" > .git/action-proof/source/package.json

      - name: Setup pnpm from source manifest
        uses: pnpm/action-setup@v6
        with:
          package_json_file: .git/action-proof/source/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Check scripts
        run: |
          node --check scripts/openclaw-release-evidence.mjs
          node --check scripts/openclaw-release-evidence-from-full-validation.mjs
          node --check scripts/release-npm-beta-floor.mjs

      - name: Run workflow regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v

      - name: Run script tests
        run: node --test 'tests/*.test.mjs'

      - name: Exercise selected package manager
        working-directory: .git/action-proof/source
        env:
          PNPM_VERSION: ${{ matrix.pnpm }}
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "$PNPM_VERSION"
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm store path

      - name: Prepare action round-trip proof
        run: |
          mkdir -p "$RUNNER_TEMP/action-proof"
          printf 'release action round-trip proof\n' > "$RUNNER_TEMP/action-proof/proof.txt"

      - name: Save proof cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/action-proof
          key: release-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove local cache input
        run: rm "$RUNNER_TEMP/action-proof/proof.txt"

      - name: Restore proof cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/action-proof
          key: release-ci-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Upload restored proof
        id: proof
        uses: actions/upload-artifact@v7
        with:
          name: action-proof-${{ runner.os }}
          path: ${{ runner.temp }}/action-proof/proof.txt
          if-no-files-found: error
          retention-days: 1

      # Download the immutable upload result directly; immediate name/list lookup
      # can miss an artifact that upload-artifact has already finalized.
      - name: Download and verify uploaded proof
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          PROOF_ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import io
          import os
          import re
          import subprocess
          import zipfile

          artifact_id = os.environ["PROOF_ARTIFACT_ID"]
          digest = os.environ["PROOF_ARTIFACT_DIGEST"]
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Upload did not return a valid artifact ID and SHA-256 digest.")
          archive = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"],
              check=True, stdout=subprocess.PIPE,
          ).stdout
          if hashlib.sha256(archive).hexdigest() != digest:
              raise SystemExit("Downloaded archive differs from the uploaded artifact digest.")
          with zipfile.ZipFile(io.BytesIO(archive)) as proof:
              if proof.namelist() != ["proof.txt"] or proof.read("proof.txt") != b"release action round-trip proof\n":
                  raise SystemExit("Cache and artifact round-trip content differs from the expected proof.")
          print("Cache and artifact round trips passed.")
          PYTHON
